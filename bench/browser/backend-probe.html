<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@prnt/dagr-render backend probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      /*
        The CSS box and the drawing buffer are both stated, at device pixel
        ratio 1, so the screenshot this produces is comparable to the rest of
        assets/screenshots/ and so a stretched canvas cannot be mistaken for a
        rendering difference between the backends.
      */
      #frame {
        position: relative;
        width: 480px;
        height: 320px;
      }
      #stage {
        width: 480px;
        height: 320px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="frame"><canvas id="stage"></canvas></div>
    <!--
      An import map rather than a bundler. The two specifiers @prnt/dagr-render's
      dist actually uses are three/webgpu and three/tsl, and the runner rewrites
      both to the paths its own `require.resolve` found, so this page never
      names a pnpm directory and never goes stale against a three upgrade.
    -->
    <script type="importmap">
      { "imports": { "three/webgpu": "__THREE_WEBGPU__", "three/tsl": "__THREE_TSL__" } }
    </script>
    <script type="module">
      import {
        advanceDashFlow,
        createHtmlOverlay,
        createNodeGroupLayer,
        createRenderer,
        createRichNodes,
        nodeGroupBounds,
      } from '/packages/render/dist/index.js';
      import {
        DEFAULT_FLATTEN_TOLERANCE_FRACTION,
        RIBBON_AA_PADDING_PIXELS,
        smoothCentreline,
        tessellateRibbons,
      } from '/packages/render/dist/ribbon.js';

      /**
       * The M4.2 shape ladder reduced to two shapes, one from each family.
       *
       * Two rather than six because what this page asks is whether the TSL
       * graphs COMPILE and draw on a backend, and the two families are two
       * meshes with two materials and therefore two pipelines. A third
       * rounded rect would exercise nothing a second instance of the first
       * does not.
       */
      const NODES = [
        {
          id: 'rect',
          shape: 'roundedRect',
          center: { x: -60, y: 0 },
          size: { width: 90, height: 50 },
          cornerRadius: 10,
          fillColor: 0xffb703,
          glowColor: 0xfb8500,
          glowWorld: 8,
        },
        {
          id: 'circle',
          shape: 'circle',
          center: { x: 60, y: 0 },
          size: { width: 60, height: 60 },
          cornerRadius: 0,
          fillColor: 0x8ecae6,
          glowColor: 0x219ebc,
          glowWorld: 8,
        },
      ];

      /**
       * The area each fill should cover, in device pixels, from the same
       * records the renderer is given.
       *
       * **This is what turns "it drew" into "it drew the right thing at the
       * right size".** A count of amber pixels says a shape is there; a count
       * that matches the area of a 90 by 50 rounded rectangle says it is THAT
       * shape. Derived here rather than written as a constant, and derived from
       * NODES rather than from a copy of its numbers, because a hand copy that
       * drifts is the trap card-heights.mjs already paid for.
       *
       * The inset is the outline. `outlinePixels` is 2 DEVICE pixels drawn
       * inside the boundary in the scene's outline colour, so the fill is the
       * shape shrunk by 2 on every side, and the corner radius shrinks with it.
       * At device pixel ratio 1 a world unit is a device pixel at zoom 1, which
       * is the view this page uses and states.
       *
       * Boundary pixels are blended toward the halo and fail the hue test, so
       * the count runs slightly UNDER the area rather than over it, and by more
       * on the circle than on the rectangle because a circle of this size is
       * almost all boundary.
       */
      const OUTLINE_DEVICE_PX = 2;
      const expectedFillArea = (node) => {
        const inset = OUTLINE_DEVICE_PX * 2;
        const width = node.size.width - inset;
        const height = node.size.height - inset;
        if (node.shape === 'circle') return Math.PI * (width / 2) * (height / 2);
        const radius = Math.max(0, node.cornerRadius - OUTLINE_DEVICE_PX);
        return width * height - (4 - Math.PI) * radius * radius;
      };

      // The drawn canvas holds a WebGL or WebGPU context, so it has no 2d
      // context to read pixels out of. The reading happens through a second
      // canvas the drawn one is copied into, which is what a screenshot does
      // anyway.
      const readPixels = (canvas) => {
        const scratch = document.createElement('canvas');
        scratch.width = canvas.width;
        scratch.height = canvas.height;
        const ctx = scratch.getContext('2d');
        ctx.drawImage(canvas, 0, 0);
        return ctx.getImageData(0, 0, scratch.width, scratch.height).data;
      };

      /**
       * Builds a renderer under one preference, draws one frame, and counts
       * what reached the canvas.
       *
       * The pixel counts are the point. "It drew" asserted from the absence of
       * a thrown error is a claim an empty canvas satisfies, which is the trap
       * D1's entry already names about the demo's own check ("the DOM tiers are
       * satisfied by a blank canvas"), so this reads the drawing buffer back and
       * counts pixels that are not the clear colour, plus the two fills it
       * should be able to find by hue and compare against their own areas.
       */
      window.probe = async (backend, keep = false) => {
        // A FRESH canvas per run, which the first version of this page did not
        // do and paid for: a canvas holds one context for its whole life, so
        // the second `createRenderer` on the same element came back with a
        // TypeError out of three rather than with anything about backends. That
        // is a fact about canvases rather than about this package, and it is
        // worth the four lines here because the probe's whole job is to be
        // three independent runs.
        const previous = document.getElementById('stage');
        const canvas = document.createElement('canvas');
        canvas.id = 'stage';
        previous.replaceWith(canvas);
        const viewport = { width: 480, height: 320, devicePixelRatio: 1 };
        let renderer;
        try {
          renderer = await createRenderer({ canvas, backend, nodes: NODES });
        } catch (error) {
          return { backend, ok: false, error: String(error), code: error && error.code };
        }
        renderer.camera.setViewport(viewport);
        renderer.render();
        const data = readPixels(canvas);
        let lit = 0;
        let amber = 0;
        let blue = 0;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          // The clear colour is 0x0b0d10. Anything meaningfully above it came
          // from a shape, and the two fills are separable by which channel
          // dominates: 0xffb703 is red over blue, 0x8ecae6 is blue over red.
          if (r + g + b > 0x0b + 0x0d + 0x10 + 24) lit += 1;
          if (r > 200 && g > 140 && b < 80) amber += 1;
          if (b > 200 && r < 200 && g > 180) blue += 1;
        }
        const reported = renderer.backend;
        // `keep` leaves the renderer alive so the caller can screenshot the
        // canvas, and the default does not. Disposing releases the context and
        // the canvas goes blank, which cost this file one committed screenshot
        // of an empty frame under a caption that said otherwise: the pixel
        // counts above were taken before the dispose and were right, and the
        // image taken after it was white. Counting and looking are two checks.
        if (!keep) renderer.dispose();
        return {
          backend,
          ok: true,
          reported,
          drawingBuffer: { width: canvas.width, height: canvas.height },
          lit,
          amber,
          blue,
          expected: {
            amber: Math.round(expectedFillArea(NODES[0])),
            blue: Math.round(expectedFillArea(NODES[1])),
          },
        };
      };

      /**
       * What a capability probe before `init()` would have said, against what
       * asking for an adapter actually gives.
       *
       * This pair is the reason `backend.ts` reads the backend AFTER `init()`
       * rather than probing before it, so the page reports both halves rather
       * than the conclusion.
       */
      window.webgpuAdvertised = async () => {
        if (!('gpu' in navigator)) return { navigatorGpu: false, adapter: null };
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter === null) return { navigatorGpu: true, adapter: null };
        const { vendor, architecture, device, description } = adapter.info;
        return {
          navigatorGpu: true,
          adapter: {
            vendor,
            architecture,
            device,
            description,
            isFallbackAdapter: adapter.info.isFallbackAdapter ?? adapter.isFallbackAdapter,
          },
        };
      };

      /**
       * M4.9b: the same scene through WebGPU and WebGL2 over `FLOW_FRAMES`
       * frames, each compared pixel by pixel with the other backend's at the
       * same flow, with the tolerance taken from the antialiasing ramp.
       *
       * `fillCoverage` and `outlineCoverage` in `sdf.ts` are smoothsteps one
       * `aaWidth` wide, centred on the shape's boundary and on the outline's
       * inner edge. `aaWidth` comes from screen-space derivatives, the one
       * input the two backends may compute differently; it is one device
       * pixel here. A pixel centre more than one device pixel from both edges
       * has coverage exactly 0 or 1 for any `aaWidth` up to 1.2 (the inner
       * edge sits at `outlinePixels * aaWidth`, so it moves with the width
       * too), and the glow ignores `aaWidth` while `glowWorld` exceeds it. The
       * rest of that pixel's colour is the same arithmetic on both backends,
       * expected to differ by 8-bit rounding at most. Inside the band any
       * difference is allowed and counted.
       *
       * `shiftX` moves the first node on the WebGL2 side only. It is the
       * control and must fail. A sub-pixel shift moves the fill and outline
       * edges only within the band, so it is the glow's gradient that catches
       * it; a shape without glow shifted the same way would pass.
       *
       * `edgeShift` moves every ribbon on the WebGL2 side by that much in x and
       * y, the edges' control. A ribbon has no glow, so only a shift wider than
       * the band can show: at 2 px, pixels the band leaves outside it change.
       *
       * `dashShift` flows both dashed groups' patterns by that much further on
       * the WebGL2 side, the dashes' control. It moves dash ends along the
       * ribbons and nothing else, so it fails only if the comparison can see
       * where a dash ends.
       *
       * `holdFlow` keeps the WebGL2 side's flow at its first frame's value, the
       * flow's control. It fails only if the comparison can see the frames
       * after the first move their dashes.
       *
       * `curveControl` draws both smooth groups as polylines through the same
       * points on the WebGL2 side, the curve's control. It fails only if the
       * comparison can see that the curve was smoothed.
       *
       * `layerControl` draws the above-nodes group below the nodes on the
       * WebGL2 side, the layer's control; see `ABOVE`.
       */
      const EDGE_BAND_DEVICE_PX = 1;
      const ROUNDING = 1;

      /**
       * Two solid ribbons under the shapes: an elbow with two right-angle
       * joins from the rectangle to the circle, and a diagonal into the
       * rectangle, so the ribbon pipeline is compared too.
       *
       * `ribbonCoverage` in `ribbon.ts` ramps over half a device pixel either
       * side of the visible boundary, `halfWidthPixels` from the centreline,
       * from interpolated geometry rather than derivatives. The band reuses the
       * shapes' one pixel either side as a margin, so a ribbon moved by up to
       * a pixel along an axis can pass; the edge control below is wider. Two
       * places are put in the band whole, since there the distance to the
       * centreline is not what the ribbon draws: a butt cap is a hard edge
       * resolved by multisampling, and a right-angle join is mitred, a square
       * corner the distance rounds off, whose ramp ends within 2.5 * sqrt(2)
       * px of the route point. Both are within `halfWidthPixels + 2` of it.
       */
      const EDGE_STYLE = { halfWidthPixels: 2 };
      const EDGE_COLOR = 0x8d99ae;
      const EDGES = [
        {
          id: 'elbow',
          points: [
            { x: -60, y: -25 },
            { x: -60, y: -90 },
            { x: 60, y: -90 },
            { x: 60, y: -30 },
          ],
          color: EDGE_COLOR,
        },
        {
          id: 'diagonal',
          points: [
            { x: -210, y: 130 },
            { x: -80, y: 25 },
          ],
          color: EDGE_COLOR,
        },
      ];

      /**
       * Three dashed ribbons in a group of their own, clear of the shapes and
       * their glow: one horizontal, one diagonal, and one through a mitred
       * right angle and then a fanned 130 degree turn.
       *
       * A join's outer vertices sit off the corner yet carry the corner's arc,
       * so near a join the arc the fragment stage interpolates is not the arc
       * of the nearest centreline point. The page therefore does not place the
       * dash ends from the centreline. It tessellates the group with the
       * renderer's own `tessellateRibbons` and interpolates `arc` and `across`
       * over each triangle, as the fragment stage does; see `dashedClasses`.
       *
       * `dashDistance` in `ribbon.ts` is a signed distance in device pixels
       * along the ribbon, put through the same one-pixel ramp as the width, so
       * a pixel within one device pixel of a dash end goes in the band.
       *
       * Both sides draw `FLOW_FRAMES` frames, a frame apart, the first with
       * the pattern flowed by `DASH_FLOW_PIXELS` and each later one advanced
       * by `advanceDashFlow` at the style's speed over one 60 Hz frame. Each
       * step moves every dash end by more than the band and less than a dash,
       * so a backend that dropped the flow, or kept a frame's flow into the
       * next, would draw edge colour where the page expects a gap. The third
       * frame's flow wraps past the period, to 1.5 pixels.
       */
      const DASHED_STYLE = {
        halfWidthPixels: 2,
        dash: { periodPixels: 12, duty: 0.5, speedPixelsPerSecond: 270 },
      };
      const DASH_FLOW_PIXELS = 4.5;
      const FRAME_SECONDS = 1 / 60;
      const FLOW_FRAMES = 3;
      const FLOWS = [DASH_FLOW_PIXELS];
      while (FLOWS.length < FLOW_FRAMES) {
        const { periodPixels, speedPixelsPerSecond } = DASHED_STYLE.dash;
        FLOWS.push(advanceDashFlow(FLOWS[FLOWS.length - 1], speedPixelsPerSecond, FRAME_SECONDS, periodPixels));
      }
      const DASHED = [
        {
          id: 'dashed-horizontal',
          points: [
            { x: -200, y: -130 },
            { x: 200, y: -130 },
          ],
          color: EDGE_COLOR,
        },
        {
          id: 'dashed-diagonal',
          points: [
            { x: 90, y: 140 },
            { x: 200, y: 40 },
          ],
          color: EDGE_COLOR,
        },
        {
          id: 'dashed-joins',
          points: [
            { x: 105, y: -45 },
            { x: 165, y: -45 },
            { x: 165, y: -110 },
            { x: 225, y: -60 },
          ],
          color: EDGE_COLOR,
        },
      ];
      const CLEAR_COLOR = 0x0b0d10;

      /**
       * One solid smooth ribbon in a group of its own, an S through four
       * points above the shapes, clear of them, their glow and the other
       * ribbons.
       *
       * The renderer draws the flattened curve, not the true one, and its
       * default chord tolerance is 1% of the mean span, here 0.74 world
       * units: wider than the band, so the page could not derive the band from
       * the true curve. It flattens with the renderer's own `smoothCentreline`
       * at that tolerance instead, whose curve the unit tests check. The
       * flattened joins turn by 43 degrees at most, where a mitre sits 0.15
       * device pixels outside the distance to the centreline, inside the band,
       * so only the butt caps go in the band whole.
       */
      const SMOOTH = [
        {
          id: 'smooth',
          points: [
            { x: -50, y: 60 },
            { x: -20, y: 130 },
            { x: 20, y: 65 },
            { x: 55, y: 125 },
          ],
          color: EDGE_COLOR,
        },
      ];
      const flattened = (points) => {
        let total = 0;
        for (let i = 1; i < points.length; i += 1) {
          total += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        }
        return smoothCentreline(points, (DEFAULT_FLATTEN_TOLERANCE_FRACTION * total) / (points.length - 1));
      };
      const SMOOTH_DRAWN = SMOOTH.map((edge) => ({ ...edge, points: flattened(edge.points) }));

      /**
       * One smooth dashed ribbon in a group of its own, `DASHED_STYLE` with
       * `curve: 'smooth'`, an S through four points below and left of the
       * shapes, clear of them, their glow and the other ribbons. Its flow
       * advances frame by frame with the straight dashes'.
       *
       * The page classes it as it classes the dashed group, from the group's
       * own triangles, here tessellated with `curve: 'smooth'` as the renderer
       * is given it, so the flattened curve's many short joins place their
       * dash ends as drawn. Counted apart from the straight dashes, so a
       * curved dash drawn somewhere else cannot hide among their pixels.
       */
      const SMOOTH_DASHED = [
        {
          id: 'smooth-dashed',
          points: [
            { x: -220, y: -55 },
            { x: -185, y: -105 },
            { x: -145, y: -55 },
            { x: -105, y: -100 },
          ],
          color: EDGE_COLOR,
        },
      ];

      /**
       * One solid ribbon in a group of its own on `layer: 'above-nodes'`,
       * straight across the circle, so it is drawn over the circle's fill,
       * outline and glow rather than under them.
       *
       * Its band is the straight ribbons' band, and its interior counts with
       * theirs where no glow lies under it. Where the circle's fill lies under
       * the ribbon, the pixel must hold the edge colour on WebGPU too, or the
       * layer is not drawn above the nodes whatever the two backends agree on.
       *
       * `layerControl` declares this group on the default layer on the WebGL2
       * side, the layer's control. There the circle covers the ribbon, so the
       * pixels counted above hold the fill instead.
       */
      const ABOVE = [
        {
          id: 'above',
          points: [
            { x: 20, y: 8 },
            { x: 110, y: 8 },
          ],
          color: EDGE_COLOR,
        },
      ];

      const segmentDistance = (a, b, x, y) => {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy)));
        return { distance: Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy)) };
      };

      const ribbonDistances = (edge, x, y) => {
        let centreline = Infinity;
        for (let i = 1; i < edge.points.length; i += 1) {
          centreline = Math.min(centreline, segmentDistance(edge.points[i - 1], edge.points[i], x, y).distance);
        }
        let point = Infinity;
        for (const p of edge.points) point = Math.min(point, Math.hypot(x - p.x, y - p.y));
        return { centreline, point };
      };

      // The page's copy of `dashDistance`, given the arc in device pixels.
      const dashDistance = (arc, flowPixels) => {
        const { periodPixels, duty } = DASHED_STYLE.dash;
        const phase = (arc - flowPixels) / periodPixels;
        const fract = phase - Math.floor(phase);
        return (Math.abs(fract - 0.5) - duty * 0.5) * periodPixels;
      };

      const SOLID = 1;
      const GAP = 2;
      const OUTSIDE = 3;
      const BAND = 4;
      /**
       * What a group of `DASHED_STYLE` routes, tessellated with `options` and
       * flowed by `flowPixels`, draws at each device pixel of a `width` by
       * `height` frame: SOLID, GAP (inside the width, between dashes),
       * OUTSIDE (beyond the width) or BAND, from the group's own triangles.
       *
       * Each triangle's `arc` and `across` are interpolated at the pixel
       * centre and put through the page's copy of the coverage, so a mitred or
       * fanned join is placed exactly as drawn. A triangle within half a pixel
       * diagonal of the centre counts even when the centre is outside it,
       * since multisampling can let it reach the pixel, and its values are
       * extended there. Where the triangles reaching a pixel disagree, as
       * where two segments overlap on the inside of a fanned turn, the pixel
       * goes in the band; a gap and the outside are both clear, so they agree.
       * The renderer draws front faces only, so a clockwise triangle, which a
       * segment shorter than its two joins' mitre shifts folds into, is skipped.
       *
       * This holds only while the varyings are evaluated at the pixel centre.
       * Under centroid or per-sample interpolation the arc along a mitred
       * segment's quad moves by about 1.5 px across one pixel, more than the
       * one-pixel margin.
       *
       * Positions and `arc` are world units and the offsets device pixels, so
       * at `zoom` the positions scale into device pixels by it and the arc by
       * `arcZoom`, which differs from `zoom` only for a control.
       */
      const dashedClasses = (routes, options, flowPixels, width, height, zoom = 1, arcZoom = zoom) => {
        const { position, offset, across, arc, index } = tessellateRibbons(routes, options);
        const hw = DASHED_STYLE.halfWidthPixels;
        const expand = hw + RIBBON_AA_PADDING_PIXELS;
        const reach = Math.SQRT1_2;
        const classes = new Uint8Array(width * height);
        for (let t = 0; t < index.length; t += 3) {
          const v = [index[t], index[t + 1], index[t + 2]];
          const vx = v.map((k) => position[2 * k] * zoom + offset[2 * k] * expand);
          const vy = v.map((k) => position[2 * k + 1] * zoom + offset[2 * k + 1] * expand);
          const det = (vx[1] - vx[0]) * (vy[2] - vy[0]) - (vx[2] - vx[0]) * (vy[1] - vy[0]);
          if (det <= 0) continue;
          const colFrom = Math.max(0, Math.floor(Math.min(...vx) - reach + width / 2));
          const colTo = Math.min(width - 1, Math.ceil(Math.max(...vx) + reach + width / 2));
          const rowFrom = Math.max(0, Math.floor(height / 2 - Math.max(...vy) - reach));
          const rowTo = Math.min(height - 1, Math.ceil(height / 2 - Math.min(...vy) + reach));
          for (let row = rowFrom; row <= rowTo; row += 1) {
            for (let col = colFrom; col <= colTo; col += 1) {
              const x = col + 0.5 - width / 2;
              const y = height / 2 - (row + 0.5);
              const w1 = ((x - vx[0]) * (vy[2] - vy[0]) - (vx[2] - vx[0]) * (y - vy[0])) / det;
              const w2 = ((vx[1] - vx[0]) * (y - vy[0]) - (x - vx[0]) * (vy[1] - vy[0])) / det;
              const w0 = 1 - w1 - w2;
              if (w0 < 0 || w1 < 0 || w2 < 0) {
                let outside = Infinity;
                for (let e = 0; e < 3; e += 1) {
                  const a = { x: vx[e], y: vy[e] };
                  const b = { x: vx[(e + 1) % 3], y: vy[(e + 1) % 3] };
                  outside = Math.min(outside, segmentDistance(a, b, x, y).distance);
                }
                if (outside > reach) continue;
              }
              const side = Math.abs(w0 * across[v[0]] + w1 * across[v[1]] + w2 * across[v[2]]) * expand - hw;
              const along = dashDistance((w0 * arc[v[0]] + w1 * arc[v[1]] + w2 * arc[v[2]]) * arcZoom, flowPixels);
              let cls = BAND;
              if (Math.max(side, along) < -EDGE_BAND_DEVICE_PX) cls = SOLID;
              else if (side < -EDGE_BAND_DEVICE_PX && along > EDGE_BAND_DEVICE_PX) cls = GAP;
              else if (side > EDGE_BAND_DEVICE_PX) cls = OUTSIDE;
              const at = row * width + col;
              const before = classes[at];
              if (before === 0 || before === cls) classes[at] = cls;
              else if ((before === GAP || before === OUTSIDE) && (cls === GAP || cls === OUTSIDE)) classes[at] = OUTSIDE;
              else classes[at] = BAND;
            }
          }
        }
        return classes;
      };

      const signedDistance = (node, x, y) => {
        const px = x - node.center.x;
        const py = y - node.center.y;
        if (node.shape === 'circle') return Math.hypot(px, py) - node.size.width / 2;
        const r = node.cornerRadius;
        const qx = Math.abs(px) - node.size.width / 2 + r;
        const qy = Math.abs(py) - node.size.height / 2 + r;
        return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
      };

      /**
       * Draws the parity scene on one backend, one frame per flow, and reads
       * each frame back. `keep` leaves the renderer alive and returns it, for
       * a caller that screenshots its frame afterwards.
       */
      const draw = async (backend, nodes, edges, dashed, flows, smooth, smoothDashed, curve, above, layer, keep = false, zoom = 1, dpr = 1) => {
        const previous = document.getElementById('stage');
        const canvas = document.createElement('canvas');
        canvas.id = 'stage';
        previous.replaceWith(canvas);
        const renderer = await createRenderer({
          canvas,
          backend,
          nodes,
          edgeGroups: [
            { id: 'edges', style: EDGE_STYLE },
            { id: 'dashed', style: DASHED_STYLE },
            { id: 'smooth', style: EDGE_STYLE, curve },
            { id: 'smooth-dashed', style: DASHED_STYLE, curve },
            { id: 'above', style: EDGE_STYLE, layer },
          ],
        });
        renderer.setEdges('edges', edges);
        renderer.setEdges('dashed', dashed);
        renderer.setEdges('smooth', smooth);
        renderer.setEdges('smooth-dashed', smoothDashed);
        renderer.setEdges('above', above);
        renderer.camera.setViewport({ width: 480, height: 320, devicePixelRatio: dpr });
        renderer.camera.setZoom(zoom);
        const frames = [];
        for (const dashFlowPixels of flows) {
          if (frames.length > 0) await new Promise((resolve) => requestAnimationFrame(resolve));
          for (const group of ['dashed', 'smooth-dashed']) {
            renderer.setEdgeStyle(group, {
              halfWidthPixels: DASHED_STYLE.halfWidthPixels,
              alpha: 1,
              dashFlowPixels,
            });
          }
          renderer.render();
          frames.push(readPixels(canvas));
        }
        const reported = renderer.backend;
        if (keep) return { renderer, frames, reported, width: canvas.width, height: canvas.height };
        renderer.dispose();
        return { frames, reported, width: canvas.width, height: canvas.height };
      };

      /**
       * The parity scene's records in device pixels at `scale` device pixels
       * per world unit, so every distance below is measured where the band,
       * the outline and the ribbons' widths are stated.
       */
      const sceneAt = (scale) => {
        const routes = (edges) =>
          edges.map((edge) => ({ ...edge, points: edge.points.map((p) => ({ x: p.x * scale, y: p.y * scale })) }));
        return {
          nodes: NODES.map((node) => ({
            ...node,
            center: { x: node.center.x * scale, y: node.center.y * scale },
            size: { width: node.size.width * scale, height: node.size.height * scale },
            cornerRadius: node.cornerRadius * scale,
            glowWorld: node.glowWorld * scale,
          })),
          edges: routes(EDGES),
          dashed: routes([...DASHED, ...SMOOTH_DASHED]),
          smooth: routes(SMOOTH_DRAWN),
          above: routes(ABOVE),
        };
      };

      /**
       * What the scene `sceneAt` placed puts at the device pixel centre
       * (x, y), given the dashed groups' classes there: how far the pixel is
       * from the nearest antialiased edge, and which colour check, if any, it
       * belongs to.
       */
      const sceneClasses = (scene, dashed, curvedDashed, x, y) => {
        const hw = EDGE_STYLE.halfWidthPixels;
        const dashedHw = DASHED_STYLE.halfWidthPixels;
        let nearest = Infinity;
        let glowed = false;
        for (const node of scene.nodes) {
          const d = signedDistance(node, x, y);
          nearest = Math.min(nearest, Math.abs(d), Math.abs(d + OUTLINE_DEVICE_PX));
          if (d < node.glowWorld + EDGE_BAND_DEVICE_PX) glowed = true;
        }
        let onRibbon = false;
        let onAbove = false;
        for (const edge of scene.above) {
          const { centreline, point } = ribbonDistances(edge, x, y);
          if (point < hw + 2) nearest = 0;
          nearest = Math.min(nearest, Math.abs(centreline - hw));
          if (centreline < hw - EDGE_BAND_DEVICE_PX && point >= hw + 2) onAbove = true;
        }
        if (onAbove) onRibbon = true;
        const circle = scene.nodes.find((node) => node.id === 'circle');
        const overFill = onAbove && signedDistance(circle, x, y) < -(OUTLINE_DEVICE_PX + EDGE_BAND_DEVICE_PX);
        for (const edge of scene.edges) {
          const { centreline, point } = ribbonDistances(edge, x, y);
          if (point < hw + 2) nearest = 0;
          nearest = Math.min(nearest, Math.abs(centreline - hw));
          if (centreline < hw - EDGE_BAND_DEVICE_PX && point >= hw + 2) onRibbon = true;
        }
        let inGap = false;
        let capped = false;
        for (const edge of scene.dashed) {
          const first = edge.points[0];
          const last = edge.points[edge.points.length - 1];
          const cap = Math.min(Math.hypot(x - first.x, y - first.y), Math.hypot(x - last.x, y - last.y));
          if (cap < dashedHw + 2) capped = true;
        }
        if (capped || dashed === BAND) nearest = 0;
        else if (dashed === SOLID) onRibbon = true;
        else if (dashed === GAP) inGap = true;
        if (curvedDashed === BAND) nearest = 0;
        let onCurve = false;
        for (const edge of scene.smooth) {
          const { centreline } = ribbonDistances(edge, x, y);
          const first = edge.points[0];
          const last = edge.points[edge.points.length - 1];
          const cap = Math.min(Math.hypot(x - first.x, y - first.y), Math.hypot(x - last.x, y - last.y));
          if (cap < hw + 2) nearest = 0;
          nearest = Math.min(nearest, Math.abs(centreline - hw));
          if (centreline < hw - EDGE_BAND_DEVICE_PX && cap >= hw + 2) onCurve = true;
        }
        return { nearest, glowed, onRibbon, overFill, inGap, capped, curvedDashed, onCurve };
      };

      /**
       * `dpr` draws the scene at that device pixel ratio and zoom 1, where a
       * world unit is `dpr` device pixels and the frame is `dpr` times as many
       * device pixels across. The outline, the ribbons' widths, the dash
       * period and flow, and the band stay in device pixels. `shiftX` and
       * `edgeShift` are in world units, so a caller moving something a set
       * number of device pixels divides them by the ratio; `dashShift` is
       * added to the flow and stays in device pixels. The other parameters
       * are described above `EDGE_BAND_DEVICE_PX`. `expectedDpr` places the
       * scene the colour checks expect at that ratio while the canvas and the
       * band stay at `dpr`, so it fails only if those checks can see that the
       * scene follows the ratio.
       */
      window.parity = async (
        shiftX = 0,
        edgeShift = 0,
        dashShift = 0,
        curveControl = false,
        holdFlow = false,
        layerControl = false,
        dpr = 1,
        expectedDpr = dpr,
      ) => {
        const shifted = NODES.map((node, i) =>
          i === 0 ? { ...node, center: { x: node.center.x + shiftX, y: node.center.y } } : node,
        );
        const shiftEdges = (edges) =>
          edges.map((edge) => ({
            ...edge,
            points: edge.points.map((p) => ({ x: p.x + edgeShift, y: p.y + edgeShift })),
          }));
        let gpu;
        let gl;
        try {
          gpu = await draw(
            'webgpu',
            NODES,
            EDGES,
            DASHED,
            FLOWS,
            SMOOTH,
            SMOOTH_DASHED,
            'smooth',
            ABOVE,
            'above-nodes',
            false,
            1,
            dpr,
          );
          gl = await draw(
            'webgl2',
            shifted,
            shiftEdges(EDGES),
            shiftEdges(DASHED),
            FLOWS.map((flow) => (holdFlow ? FLOWS[0] : flow) + dashShift),
            shiftEdges(SMOOTH),
            shiftEdges(SMOOTH_DASHED),
            curveControl ? 'polyline' : 'smooth',
            shiftEdges(ABOVE),
            layerControl ? 'below-nodes' : 'above-nodes',
            false,
            1,
            dpr,
          );
        } catch (error) {
          return { pass: false, error: String(error), code: error && error.code };
        }
        const drawnScene = sceneAt(dpr);
        const expectedScene = sceneAt(expectedDpr);
        // Every count below is summed over the frames, and `frames` keeps
        // each frame's comparison.
        const band = { pixels: 0, differing: 0, maxDelta: 0 };
        const interior = { pixels: 0, differing: 0, maxDelta: 0 };
        // All of these must hold the edge colour, or the band above was
        // derived for a ribbon somewhere else. A dash counts here too.
        const ribbon = { pixels: 0, edgeColored: 0 };
        // And these, the gaps between dashes, must hold the clear colour, or
        // the dashed group was drawn solid or out of phase with the page.
        const gap = { pixels: 0, clear: 0 };
        // Inside the smooth ribbon, counted apart so a curve drawn somewhere
        // else cannot hide among the straight ribbons' pixels.
        const curve = { pixels: 0, edgeColored: 0 };
        const curvedDash = { pixels: 0, edgeColored: 0, gapPixels: 0, clear: 0 };
        const over = { pixels: 0, edgeColored: 0 };
        const near = (data, i, color) =>
          [16, 8, 0].every((shift, c) => Math.abs(data[i + c] - ((color >> shift) & 0xff)) <= ROUNDING);
        const frames = [];
        const classesAt = (scale, flow) => ({
          dashed: dashedClasses(DASHED, undefined, flow, gpu.width, gpu.height, scale),
          curved: dashedClasses(SMOOTH_DASHED, { curve: 'smooth' }, flow, gpu.width, gpu.height, scale),
        });
        for (let f = 0; f < FLOWS.length; f += 1) {
          const gpuData = gpu.frames[f];
          const glData = gl.frames[f];
          const frameBand = { differing: 0, maxDelta: 0 };
          const frameInterior = { differing: 0, maxDelta: 0 };
          const drawnClasses = classesAt(dpr, FLOWS[f]);
          const expectedClasses = expectedDpr === dpr ? drawnClasses : classesAt(expectedDpr, FLOWS[f]);
          for (let row = 0; row < gpu.height; row += 1) {
            for (let col = 0; col < gpu.width; col += 1) {
              // Device pixel centres, y up, the origin at the canvas centre.
              const x = col + 0.5 - gpu.width / 2;
              const y = gpu.height / 2 - (row + 0.5);
              const at = row * gpu.width + col;
              const drawn = sceneClasses(drawnScene, drawnClasses.dashed[at], drawnClasses.curved[at], x, y);
              const { glowed, onRibbon, overFill, inGap, capped, curvedDashed, onCurve } =
                expectedDpr === dpr
                  ? drawn
                  : sceneClasses(expectedScene, expectedClasses.dashed[at], expectedClasses.curved[at], x, y);
              const { nearest } = drawn;
              const i = at * 4;
              if (onCurve && !glowed) {
                curve.pixels += 1;
                if (near(gpuData, i, EDGE_COLOR)) curve.edgeColored += 1;
              }
              if (overFill) {
                over.pixels += 1;
                if (near(gpuData, i, EDGE_COLOR)) over.edgeColored += 1;
              }
              if (onRibbon && !glowed) {
                ribbon.pixels += 1;
                if (near(gpuData, i, EDGE_COLOR)) ribbon.edgeColored += 1;
              }
              if (!capped && !glowed && curvedDashed === SOLID) {
                curvedDash.pixels += 1;
                if (near(gpuData, i, EDGE_COLOR)) curvedDash.edgeColored += 1;
              }
              if (!capped && !glowed && curvedDashed === GAP) {
                curvedDash.gapPixels += 1;
                if (near(gpuData, i, CLEAR_COLOR)) curvedDash.clear += 1;
              }
              if (inGap && !onRibbon && !glowed) {
                gap.pixels += 1;
                if (near(gpuData, i, CLEAR_COLOR)) gap.clear += 1;
              }
              const delta = Math.max(
                Math.abs(gpuData[i] - glData[i]),
                Math.abs(gpuData[i + 1] - glData[i + 1]),
                Math.abs(gpuData[i + 2] - glData[i + 2]),
                Math.abs(gpuData[i + 3] - glData[i + 3]),
              );
              const inBand = nearest < EDGE_BAND_DEVICE_PX;
              const bucket = inBand ? band : interior;
              const frameBucket = inBand ? frameBand : frameInterior;
              bucket.pixels += 1;
              if (delta > 0) {
                bucket.differing += 1;
                frameBucket.differing += 1;
              }
              bucket.maxDelta = Math.max(bucket.maxDelta, delta);
              frameBucket.maxDelta = Math.max(frameBucket.maxDelta, delta);
            }
          }
          frames.push({ flowPixels: FLOWS[f], band: frameBand, interior: frameInterior });
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        const sameSize = gl.width === gpu.width && gl.height === gpu.height;
        const ribbonDrawn =
          ribbon.pixels > 0 &&
          ribbon.edgeColored === ribbon.pixels &&
          gap.pixels > 0 &&
          gap.clear === gap.pixels &&
          curve.pixels > 0 &&
          curve.edgeColored === curve.pixels &&
          curvedDash.pixels > 0 &&
          curvedDash.edgeColored === curvedDash.pixels &&
          curvedDash.gapPixels > 0 &&
          curvedDash.clear === curvedDash.gapPixels &&
          over.pixels > 0 &&
          over.edgeColored === over.pixels;
        return {
          pass:
            gpu.reported === 'webgpu' &&
            gl.reported === 'webgl2' &&
            sameSize &&
            ribbonDrawn &&
            interior.maxDelta <= ROUNDING,
          backends,
          sameSize,
          tolerance: { edgeBandDevicePx: EDGE_BAND_DEVICE_PX, interiorMaxDelta: ROUNDING },
          shiftX,
          edgeShift,
          dashShift,
          curveControl,
          holdFlow,
          layerControl,
          dpr,
          expectedDpr,
          size: { width: gpu.width, height: gpu.height },
          frames,
          band,
          interior,
          ribbon,
          gap,
          curve,
          curvedDash,
          over,
          ribbonDrawn,
        };
      };

      /**
       * The shapes alone at a zoom or device pixel ratio other than 1,
       * compared the way `parity` compares them at zoom 1 and ratio 1.
       *
       * A device pixel is `1 / zoom` world units here, so the page maps each
       * pixel centre into the world through the zoom. The outline stays
       * `OUTLINE_DEVICE_PX` device pixels wide at every zoom, so its inner
       * edge sits that many device pixels inside the boundary, and the band is
       * one device pixel either side of each edge. The glow is in world units
       * and still exceeds `aaWidth` (two world units at zoom 0.5), so it
       * leaves the band where it was.
       *
       * Every pixel further inside a fill than the band must hold the fill
       * colour on WebGPU, so a shape drawn at another size cannot pass.
       * `shiftX` is `parity`'s control, given in world units. `expectedZoom`
       * places the fills the page expects at that zoom while the canvas and
       * the band stay at `zoom`, so it fails only if the fill check can see
       * that the shapes follow the zoom.
       *
       * `dpr` draws at that device pixel ratio, where a device pixel is
       * `1 / (zoom * dpr)` world units and the frame is `dpr` times as many
       * device pixels across. The outline and the band stay in device pixels.
       * `expectedDpr` places the expected fills at that ratio the way
       * `expectedZoom` does at its zoom.
       */
      window.shapeParity = async (zoom, shiftX = 0, expectedZoom = zoom, dpr = 1, expectedDpr = dpr) => {
        const shifted = NODES.map((node, i) =>
          i === 0 ? { ...node, center: { x: node.center.x + shiftX, y: node.center.y } } : node,
        );
        const shapes = (backend, nodes) =>
          draw(backend, nodes, [], [], [FLOWS[0]], [], [], 'smooth', [], 'above-nodes', false, zoom, dpr);
        let gpu;
        let gl;
        try {
          gpu = await shapes('webgpu', NODES);
          gl = await shapes('webgl2', shifted);
        } catch (error) {
          return { pass: false, error: String(error), code: error && error.code };
        }
        const [gpuData] = gpu.frames;
        const [glData] = gl.frames;
        const band = { pixels: 0, differing: 0, maxDelta: 0 };
        const interior = { pixels: 0, differing: 0, maxDelta: 0 };
        const fill = { pixels: 0, filled: 0 };
        const scale = zoom * dpr;
        const expectedScale = expectedZoom * expectedDpr;
        for (let row = 0; row < gpu.height; row += 1) {
          for (let col = 0; col < gpu.width; col += 1) {
            const x = col + 0.5 - gpu.width / 2;
            const y = gpu.height / 2 - (row + 0.5);
            const i = (row * gpu.width + col) * 4;
            let nearest = Infinity;
            for (const node of NODES) {
              const d = signedDistance(node, x / scale, y / scale) * scale;
              nearest = Math.min(nearest, Math.abs(d), Math.abs(d + OUTLINE_DEVICE_PX));
              const expected = signedDistance(node, x / expectedScale, y / expectedScale) * expectedScale;
              if (expected < -(OUTLINE_DEVICE_PX + EDGE_BAND_DEVICE_PX)) {
                fill.pixels += 1;
                if ([16, 8, 0].every((s, c) => Math.abs(gpuData[i + c] - ((node.fillColor >> s) & 0xff)) <= ROUNDING)) {
                  fill.filled += 1;
                }
              }
            }
            const bucket = nearest < EDGE_BAND_DEVICE_PX ? band : interior;
            const delta = pixelDelta(gpuData, glData, i);
            bucket.pixels += 1;
            if (delta > 0) bucket.differing += 1;
            bucket.maxDelta = Math.max(bucket.maxDelta, delta);
          }
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        const sameSize = gl.width === gpu.width && gl.height === gpu.height;
        const filled = fill.pixels > 0 && fill.filled === fill.pixels;
        return {
          pass:
            backends.webgpu === 'webgpu' && backends.webgl2 === 'webgl2' && sameSize && filled && interior.maxDelta <= ROUNDING,
          backends,
          sameSize,
          tolerance: { edgeBandDevicePx: EDGE_BAND_DEVICE_PX, interiorMaxDelta: ROUNDING },
          zoom,
          shiftX,
          expectedZoom,
          dpr,
          expectedDpr,
          size: { width: gpu.width, height: gpu.height },
          band,
          interior,
          fill,
          filled,
        };
      };

      /**
       * The solid straight ribbons alone at a zoom or device pixel ratio
       * other than 1, with no shapes, compared the way `parity` compares them
       * at zoom 1 and ratio 1.
       *
       * The route points are in world units but `halfWidthPixels` is in device
       * pixels, so the ribbon keeps its width at every zoom while its route
       * scales. The page therefore scales the routes into device pixels by the
       * zoom and measures every distance there, as at zoom 1. Inside the
       * ribbon must hold the edge colour on WebGPU, and a strip outside it,
       * from the band out to `BESIDE_DEVICE_PX` beyond its edge and clear of
       * the joins' mitred corners, the clear colour, so a ribbon whose width
       * followed the zoom cannot pass. `edgeShift` is
       * `parity`'s edge control, given in world units. `expectedZoom` places
       * the ribbons the page expects at that zoom while the canvas and the band
       * stay at `zoom`, so it fails only if the edge colour check can see that
       * the routes follow the zoom.
       *
       * `smooth` compares the solid smooth ribbon alone instead, measured
       * against the flattened curve the renderer draws. The renderer flattens
       * in world units, so the chords keep their turns at every zoom, and a
       * mitre's overshoot is a fraction of the width and so stays 0.15 device
       * pixels; only its butt caps go in the band whole. The chords' length on
       * screen does follow the zoom: at 0.5 two of them are shorter than the
       * bound in `ribbon.ts` below which a quad between two joins folds into a
       * bow tie, and the check sees no hole there, but below 0.5 more of them
       * fold and the inside check may fail on both backends. `curve` is the
       * WebGL2 side's curve, `parity`'s curve control when `'polyline'`.
       *
       * `dpr` draws at that device pixel ratio, where the routes scale into
       * device pixels by `zoom * dpr` and the width and the band stay in
       * device pixels. `expectedDpr` places the expected ribbons at that ratio
       * the way `expectedZoom` does at its zoom.
       */
      const BESIDE_DEVICE_PX = 3;
      window.ribbonParity = async (
        zoom,
        edgeShift = 0,
        expectedZoom = zoom,
        smooth = false,
        curve = 'smooth',
        dpr = 1,
        expectedDpr = dpr,
      ) => {
        const source = smooth ? SMOOTH : EDGES;
        const routes = smooth ? SMOOTH_DRAWN : EDGES;
        const shifted = source.map((edge) => ({
          ...edge,
          points: edge.points.map((p) => ({ x: p.x + edgeShift, y: p.y + edgeShift })),
        }));
        const ribbons = (backend, edges, drawnCurve) =>
          smooth
            ? draw(backend, [], [], [], [FLOWS[0]], edges, [], drawnCurve, [], 'above-nodes', false, zoom, dpr)
            : draw(backend, [], edges, [], [FLOWS[0]], [], [], 'smooth', [], 'above-nodes', false, zoom, dpr);
        let gpu;
        let gl;
        try {
          gpu = await ribbons('webgpu', source, 'smooth');
          gl = await ribbons('webgl2', shifted, curve);
        } catch (error) {
          return { pass: false, error: String(error), code: error && error.code };
        }
        const inDevice = (scale) =>
          routes.map((edge) => {
            const points = edge.points.map((p) => ({ x: p.x * scale, y: p.y * scale }));
            return { ...edge, points, corners: smooth ? [points[0], points[points.length - 1]] : points };
          });
        const drawn = inDevice(zoom * dpr);
        const expected = inDevice(expectedZoom * expectedDpr);
        const hw = EDGE_STYLE.halfWidthPixels;
        const [gpuData] = gpu.frames;
        const [glData] = gl.frames;
        const band = { pixels: 0, differing: 0, maxDelta: 0 };
        const interior = { pixels: 0, differing: 0, maxDelta: 0 };
        const ribbon = { pixels: 0, edgeColored: 0 };
        const beside = { pixels: 0, clear: 0 };
        const near = (data, i, color) =>
          [16, 8, 0].every((s, c) => Math.abs(data[i + c] - ((color >> s) & 0xff)) <= ROUNDING);
        for (let row = 0; row < gpu.height; row += 1) {
          for (let col = 0; col < gpu.width; col += 1) {
            const x = col + 0.5 - gpu.width / 2;
            const y = gpu.height / 2 - (row + 0.5);
            const i = (row * gpu.width + col) * 4;
            const toCorner = (edge) => Math.min(...edge.corners.map((p) => Math.hypot(x - p.x, y - p.y)));
            let nearest = Infinity;
            for (const edge of drawn) {
              const { centreline } = ribbonDistances(edge, x, y);
              if (toCorner(edge) < hw + 2) nearest = 0;
              nearest = Math.min(nearest, Math.abs(centreline - hw));
            }
            let onRibbon = false;
            let toRibbon = Infinity;
            let toPoint = Infinity;
            for (const edge of expected) {
              const { centreline } = ribbonDistances(edge, x, y);
              const point = toCorner(edge);
              if (centreline < hw - EDGE_BAND_DEVICE_PX && point >= hw + 2) onRibbon = true;
              toRibbon = Math.min(toRibbon, centreline);
              toPoint = Math.min(toPoint, point);
            }
            if (onRibbon) {
              ribbon.pixels += 1;
              if (near(gpuData, i, EDGE_COLOR)) ribbon.edgeColored += 1;
            }
            if (toRibbon > hw + EDGE_BAND_DEVICE_PX && toRibbon < hw + BESIDE_DEVICE_PX && toPoint >= hw + 4) {
              beside.pixels += 1;
              if (near(gpuData, i, CLEAR_COLOR)) beside.clear += 1;
            }
            const bucket = nearest < EDGE_BAND_DEVICE_PX ? band : interior;
            const delta = pixelDelta(gpuData, glData, i);
            bucket.pixels += 1;
            if (delta > 0) bucket.differing += 1;
            bucket.maxDelta = Math.max(bucket.maxDelta, delta);
          }
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        const sameSize = gl.width === gpu.width && gl.height === gpu.height;
        const ribbonDrawn =
          ribbon.pixels > 0 && ribbon.edgeColored === ribbon.pixels && beside.pixels > 0 && beside.clear === beside.pixels;
        return {
          pass:
            backends.webgpu === 'webgpu' &&
            backends.webgl2 === 'webgl2' &&
            sameSize &&
            ribbonDrawn &&
            interior.maxDelta <= ROUNDING,
          backends,
          sameSize,
          tolerance: { edgeBandDevicePx: EDGE_BAND_DEVICE_PX, interiorMaxDelta: ROUNDING },
          zoom,
          edgeShift,
          expectedZoom,
          smooth,
          curve,
          dpr,
          expectedDpr,
          size: { width: gpu.width, height: gpu.height },
          band,
          interior,
          ribbon,
          beside,
          ribbonDrawn,
        };
      };

      /**
       * One dashed group alone at a zoom or device pixel ratio other than 1,
       * the three dashed ribbons or with `smooth` the smooth dashed one, on
       * the first frame's flow, compared the way `parity` compares them at
       * zoom 1 and ratio 1.
       *
       * The dash period and flow are device pixels while the arc is world
       * units, so the pattern keeps its size at every zoom while the routes
       * scale. `dashedClasses` places the dashes at `zoom` from the group's
       * own triangles. Inside a dash must hold the edge colour on WebGPU and
       * inside a gap the clear colour, so a pattern that followed the zoom
       * cannot pass. `dashShift` is `parity`'s dash control. `expectedArcZoom`
       * lays out the dashes the page expects with the arc scaled by it while
       * the canvas, the routes and the band stay at `zoom`; at 1 it expects a
       * period in world units, and fails only if the dash and gap checks can
       * see that the pattern does not follow the zoom.
       *
       * With `smooth` the group's triangles are tessellated with
       * `curve: 'smooth'`, as the renderer is given them. `curve` is the
       * WebGL2 side's curve, `parity`'s curve control when `'polyline'`.
       *
       * `dpr` draws at that device pixel ratio, where the routes and the arc
       * scale into device pixels by `zoom * dpr` while the period, the flow,
       * the width and the band stay in device pixels. `expectedArcDpr` scales
       * the expected arc by that ratio instead, the way `expectedArcZoom`
       * does by its zoom; at 1 it expects a period that doubles with the
       * ratio.
       */
      window.dashParity = async (
        zoom,
        dashShift = 0,
        expectedArcZoom = zoom,
        smooth = false,
        curve = 'smooth',
        dpr = 1,
        expectedArcDpr = dpr,
      ) => {
        const routes = smooth ? SMOOTH_DASHED : DASHED;
        const options = smooth ? { curve: 'smooth' } : undefined;
        const dashes = (backend, flow, drawnCurve) =>
          smooth
            ? draw(backend, [], [], [], [flow], [], routes, drawnCurve, [], 'above-nodes', false, zoom, dpr)
            : draw(backend, [], [], routes, [flow], [], [], 'smooth', [], 'above-nodes', false, zoom, dpr);
        let gpu;
        let gl;
        try {
          gpu = await dashes('webgpu', FLOWS[0], 'smooth');
          gl = await dashes('webgl2', FLOWS[0] + dashShift, curve);
        } catch (error) {
          return { pass: false, error: String(error), code: error && error.code };
        }
        const scale = zoom * dpr;
        const drawnAt = dashedClasses(routes, options, FLOWS[0], gpu.width, gpu.height, scale);
        const expectedAt = dashedClasses(
          routes,
          options,
          FLOWS[0],
          gpu.width,
          gpu.height,
          scale,
          expectedArcZoom * expectedArcDpr,
        );
        const hw = DASHED_STYLE.halfWidthPixels;
        const [gpuData] = gpu.frames;
        const [glData] = gl.frames;
        const band = { pixels: 0, differing: 0, maxDelta: 0 };
        const interior = { pixels: 0, differing: 0, maxDelta: 0 };
        const dash = { pixels: 0, edgeColored: 0 };
        const gap = { pixels: 0, clear: 0 };
        const near = (data, i, color) =>
          [16, 8, 0].every((s, c) => Math.abs(data[i + c] - ((color >> s) & 0xff)) <= ROUNDING);
        for (let row = 0; row < gpu.height; row += 1) {
          for (let col = 0; col < gpu.width; col += 1) {
            const x = col + 0.5 - gpu.width / 2;
            const y = gpu.height / 2 - (row + 0.5);
            const i = (row * gpu.width + col) * 4;
            let capped = false;
            for (const edge of routes) {
              for (const p of [edge.points[0], edge.points[edge.points.length - 1]]) {
                if (Math.hypot(x - p.x * scale, y - p.y * scale) < hw + 2) capped = true;
              }
            }
            const at = row * gpu.width + col;
            if (!capped && expectedAt[at] === SOLID) {
              dash.pixels += 1;
              if (near(gpuData, i, EDGE_COLOR)) dash.edgeColored += 1;
            }
            if (!capped && expectedAt[at] === GAP) {
              gap.pixels += 1;
              if (near(gpuData, i, CLEAR_COLOR)) gap.clear += 1;
            }
            const bucket = capped || drawnAt[at] === BAND ? band : interior;
            const delta = pixelDelta(gpuData, glData, i);
            bucket.pixels += 1;
            if (delta > 0) bucket.differing += 1;
            bucket.maxDelta = Math.max(bucket.maxDelta, delta);
          }
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        const sameSize = gl.width === gpu.width && gl.height === gpu.height;
        const dashesDrawn =
          dash.pixels > 0 && dash.edgeColored === dash.pixels && gap.pixels > 0 && gap.clear === gap.pixels;
        return {
          pass:
            backends.webgpu === 'webgpu' &&
            backends.webgl2 === 'webgl2' &&
            sameSize &&
            dashesDrawn &&
            interior.maxDelta <= ROUNDING,
          backends,
          sameSize,
          tolerance: { edgeBandDevicePx: EDGE_BAND_DEVICE_PX, interiorMaxDelta: ROUNDING },
          zoom,
          dashShift,
          expectedArcZoom,
          smooth,
          curve,
          dpr,
          expectedArcDpr,
          size: { width: gpu.width, height: gpu.height },
          band,
          interior,
          dash,
          gap,
          dashesDrawn,
        };
      };

      /**
       * The above-nodes ribbon and the circle alone at a zoom other than 1,
       * compared the way `parity` compares them at zoom 1.
       *
       * The band is the shapes' band and the straight ribbons' band, both in
       * device pixels through the zoom, with the ribbon's butt caps in it
       * whole. On WebGPU, every pixel inside the ribbon must hold the edge
       * colour, over the circle's fill, outline and glow alike, and every
       * pixel further inside the fill than the band and clear of the ribbon
       * by the band must hold the fill colour, so a ribbon drawn under the
       * circle, or at zoom 2 one whose width followed the zoom, cannot pass.
       *
       * `edgeShift` is `parity`'s edge control, given in world units.
       * `expectedZoom` places the circle and ribbon the page expects at that
       * zoom while the canvas and the band stay at `zoom`, so it fails only
       * if the colour checks can see that both follow the zoom. `layer` is the
       * WebGL2 side's layer, `parity`'s layer control when `'below-nodes'`.
       *
       * `dpr` draws at that device pixel ratio, where the circle and the route
       * scale into device pixels by `zoom * dpr` while the outline, the
       * ribbon's width and the band stay in device pixels. `expectedDpr`
       * places the expected circle and ribbon at that ratio the way
       * `expectedZoom` does at its zoom.
       */
      const CIRCLE = NODES.filter((node) => node.id === 'circle');
      window.aboveParity = async (
        zoom,
        edgeShift = 0,
        expectedZoom = zoom,
        layer = 'above-nodes',
        dpr = 1,
        expectedDpr = dpr,
      ) => {
        const shifted = ABOVE.map((edge) => ({
          ...edge,
          points: edge.points.map((p) => ({ x: p.x + edgeShift, y: p.y + edgeShift })),
        }));
        const scene = (backend, edges, drawnLayer) =>
          draw(backend, CIRCLE, [], [], [FLOWS[0]], [], [], 'smooth', edges, drawnLayer, false, zoom, dpr);
        let gpu;
        let gl;
        try {
          gpu = await scene('webgpu', ABOVE, 'above-nodes');
          gl = await scene('webgl2', shifted, layer);
        } catch (error) {
          return { pass: false, error: String(error), code: error && error.code };
        }
        const inDevice = (scale) =>
          ABOVE.map((edge) => ({ ...edge, points: edge.points.map((p) => ({ x: p.x * scale, y: p.y * scale })) }));
        const scale = zoom * dpr;
        const expectedScale = expectedZoom * expectedDpr;
        const drawn = inDevice(scale);
        const expected = inDevice(expectedScale);
        const [circle] = CIRCLE;
        const hw = EDGE_STYLE.halfWidthPixels;
        const [gpuData] = gpu.frames;
        const [glData] = gl.frames;
        const band = { pixels: 0, differing: 0, maxDelta: 0 };
        const interior = { pixels: 0, differing: 0, maxDelta: 0 };
        const ribbon = { pixels: 0, edgeColored: 0 };
        const over = { pixels: 0, edgeColored: 0 };
        const fill = { pixels: 0, filled: 0 };
        const near = (data, i, color) =>
          [16, 8, 0].every((s, c) => Math.abs(data[i + c] - ((color >> s) & 0xff)) <= ROUNDING);
        for (let row = 0; row < gpu.height; row += 1) {
          for (let col = 0; col < gpu.width; col += 1) {
            const x = col + 0.5 - gpu.width / 2;
            const y = gpu.height / 2 - (row + 0.5);
            const i = (row * gpu.width + col) * 4;
            const d = signedDistance(circle, x / scale, y / scale) * scale;
            let nearest = Math.min(Math.abs(d), Math.abs(d + OUTLINE_DEVICE_PX));
            for (const edge of drawn) {
              const { centreline, point } = ribbonDistances(edge, x, y);
              if (point < hw + 2) nearest = 0;
              nearest = Math.min(nearest, Math.abs(centreline - hw));
            }
            let onRibbon = false;
            let toRibbon = Infinity;
            for (const edge of expected) {
              const { centreline, point } = ribbonDistances(edge, x, y);
              if (centreline < hw - EDGE_BAND_DEVICE_PX && point >= hw + 2) onRibbon = true;
              toRibbon = Math.min(toRibbon, centreline);
            }
            const inFill =
              signedDistance(circle, x / expectedScale, y / expectedScale) * expectedScale <
              -(OUTLINE_DEVICE_PX + EDGE_BAND_DEVICE_PX);
            if (onRibbon) {
              ribbon.pixels += 1;
              if (near(gpuData, i, EDGE_COLOR)) ribbon.edgeColored += 1;
              if (inFill) {
                over.pixels += 1;
                if (near(gpuData, i, EDGE_COLOR)) over.edgeColored += 1;
              }
            }
            if (inFill && toRibbon > hw + EDGE_BAND_DEVICE_PX) {
              fill.pixels += 1;
              if (near(gpuData, i, circle.fillColor)) fill.filled += 1;
            }
            const bucket = nearest < EDGE_BAND_DEVICE_PX ? band : interior;
            const delta = pixelDelta(gpuData, glData, i);
            bucket.pixels += 1;
            if (delta > 0) bucket.differing += 1;
            bucket.maxDelta = Math.max(bucket.maxDelta, delta);
          }
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        const sameSize = gl.width === gpu.width && gl.height === gpu.height;
        const aboveDrawn =
          ribbon.pixels > 0 &&
          ribbon.edgeColored === ribbon.pixels &&
          over.pixels > 0 &&
          fill.pixels > 0 &&
          fill.filled === fill.pixels;
        return {
          pass:
            backends.webgpu === 'webgpu' &&
            backends.webgl2 === 'webgl2' &&
            sameSize &&
            aboveDrawn &&
            interior.maxDelta <= ROUNDING,
          backends,
          sameSize,
          tolerance: { edgeBandDevicePx: EDGE_BAND_DEVICE_PX, interiorMaxDelta: ROUNDING },
          zoom,
          edgeShift,
          expectedZoom,
          layer,
          dpr,
          expectedDpr,
          size: { width: gpu.width, height: gpu.height },
          band,
          interior,
          ribbon,
          over,
          fill,
          aboveDrawn,
        };
      };

      /**
       * A group outline over the parity scene's first frame, composed with
       * the canvas on each backend.
       *
       * The outline is `createNodeGroupLayer`'s SVG, drawn by the browser over
       * the canvas rather than by either backend, so the two backends cannot
       * draw it differently. What can differ is the frame it is composed into:
       * where the layer lands over the canvas, and whether it covers the
       * canvas the same way on both. So the runner screenshots `#frame` with
       * the layer shown and with it hidden on each backend, and `groupParity`
       * compares the four.
       *
       * The group frames the rectangle, padded by `GROUP.padding` and with a
       * title band, so its outline crosses three ribbons and its title starts
       * on the diagonal one. Each hidden screenshot must match the canvas
       * read back from the same renderer, or the bare frames could differ
       * everywhere and excuse any difference the layer adds. On each backend,
       * every pixel the layer changes must lie within `groupRingDevicePx` of
       * the outline's rounded rectangle or inside the title's box, and the
       * changed pixels on the outline must span that rectangle. Between the
       * backends, the layer may not add a difference: a pixel that differs
       * between the two composed frames must already differ between the two
       * bare ones.
       *
       * Two controls. `paddingShift` widens the WebGL2 side's padding by that
       * much, moving its outline and title, so it fails only if the
       * comparison between the backends can see where the outline lies; that
       * side's expected rectangle moves with it. `expectedShift` widens the
       * expected rectangle on both sides and leaves the layers alone, so it
       * fails only if the placement check can see where the outline lies.
       *
       * At zoom 0.5 and 1.5 the canvas is drawn at that zoom and the layer
       * places the outline through that camera, its corner radius scaled
       * below zoom 1 and its title kept at its own pixel size. Zoom 2 would
       * push the outline's left side off the frame. `expectedZoom` expects
       * zoom 1's outline, so it fails only if the placement check can see
       * that the outline follows the zoom. Both shifts are in world units,
       * and the runner passes 1.5 / zoom so each moves the outline 1.5
       * device pixels at every zoom.
       *
       * At device pixel ratio 2 the runner screenshots a page whose device
       * scale factor is 2, so each frame is 960 by 640 and the canvas, drawn
       * at the same ratio, still fills it pixel for pixel. The layer is laid
       * out in CSS pixels, so the expected rectangle, its corners and the
       * title's box scale by the zoom times the ratio, and the ring widens
       * with the stroke. There the runner passes 1.5, which moves the
       * outline 3 device pixels. `expectedDpr` expects ratio 1's outline, so
       * it fails only if the placement check can see that the outline follows
       * the ratio.
       */
      const GROUP = { id: 'group', nodeIds: ['rect'], label: 'group', padding: 24 };
      // Half the 1.5 CSS px stroke in device pixels plus one device pixel of
      // antialiasing, rounded up.
      const groupRingDevicePx = (dpr) => Math.ceil(0.75 * dpr + 1);
      const GROUP_CORNER_RADIUS = 10;
      // Shared by the group outline and the rich-node tiers below: the held
      // renderer and layer, and the latest draw's canvas read back.
      let held;
      const composedCanvas = {};

      window.composedRelease = () => {
        if (held === undefined) return;
        held.layer?.dispose();
        held.renderer.dispose();
        held = undefined;
      };

      /**
       * Draws the first frame on `backend` at `zoom` and `dpr`, keeps the
       * renderer, and mounts a DOM layer over `#frame` through
       * `mount(camera, hold)`.
       * `mount` passes the layer to `hold` as soon as it exists, so a release
       * disposes it even when filling it throws.
       */
      const composedFrame = async (backend, mount, zoom = 1, dpr = 1) => {
        window.composedRelease();
        try {
          const scene = await draw(backend, NODES, EDGES, DASHED, [FLOWS[0]], SMOOTH, SMOOTH_DASHED, 'smooth', ABOVE, 'above-nodes', true, zoom, dpr);
          held = { renderer: scene.renderer };
          composedCanvas[backend] = scene.frames[0];
          mount(scene.renderer.camera, (layer) => (held.layer = layer));
          return { backend, reported: scene.reported };
        } catch (error) {
          window.composedRelease();
          return { backend, error: String(error), code: error && error.code };
        }
      };

      window.composedHide = () => {
        held.layer.dispose();
        held.layer = undefined;
      };

      window.groupFrame = (backend, paddingShift = 0, zoom = 1, dpr = 1) =>
        composedFrame(
          backend,
          (camera, hold) => {
            const layer = hold(createNodeGroupLayer({ parent: document.getElementById('frame'), camera }));
            layer.setGroups([{ ...GROUP, padding: GROUP.padding + paddingShift }]);
            layer.setNodes(NODES);
            layer.sync();
          },
          zoom,
          dpr,
        );

      const decodePng = async (base64) => {
        const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
        const bitmap = await createImageBitmap(new Blob([bytes], { type: 'image/png' }));
        const scratch = document.createElement('canvas');
        scratch.width = bitmap.width;
        scratch.height = bitmap.height;
        const ctx = scratch.getContext('2d');
        ctx.drawImage(bitmap, 0, 0);
        return { data: ctx.getImageData(0, 0, bitmap.width, bitmap.height).data, width: bitmap.width, height: bitmap.height };
      };

      const pixelDelta = (a, b, i) =>
        Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]), Math.abs(a[i + 3] - b[i + 3]));

      // Where one backend's layer changed its own frame, against where the
      // outline and title should be for `padding` at `zoom` and `dpr`, with
      // changed pixels within `ringPx` device pixels of the outline counted on it.
      const outlineOf = (shown, hidden, padding, zoom, dpr, ringPx) => {
        const { width, height } = shown;
        const bounds = nodeGroupBounds(NODES, { ...GROUP, padding });
        const scale = zoom * dpr;
        const box = {
          left: bounds.minX * scale + width / 2,
          right: bounds.maxX * scale + width / 2,
          top: height / 2 - bounds.maxY * scale,
          bottom: height / 2 - bounds.minY * scale,
        };
        // The layer's own title placement (12 CSS px in, baseline 18 down, 12
        // px monospace) and its own allowance of 8 per character, widened by
        // two device pixels for the glyphs' antialiasing.
        const title = {
          left: box.left + 12 * dpr - 2,
          right: box.left + (12 + GROUP.label.length * 8) * dpr + 2,
          top: box.top + (18 - 12) * dpr - 2,
          bottom: box.top + (18 + 4) * dpr,
        };
        const outlineNode = {
          shape: 'roundedRect',
          center: { x: (box.left + box.right) / 2, y: (box.top + box.bottom) / 2 },
          size: { width: box.right - box.left, height: box.bottom - box.top },
          cornerRadius: Math.min(GROUP_CORNER_RADIUS, GROUP_CORNER_RADIUS * zoom) * dpr,
        };
        const span = { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity };
        let ring = 0;
        let titled = 0;
        let stray = 0;
        for (let row = 0; row < height; row += 1) {
          for (let col = 0; col < width; col += 1) {
            if (pixelDelta(shown.data, hidden.data, (row * width + col) * 4) === 0) continue;
            const x = col + 0.5;
            const y = row + 0.5;
            if (Math.abs(signedDistance(outlineNode, x, y)) <= ringPx) {
              ring += 1;
              span.left = Math.min(span.left, x);
              span.right = Math.max(span.right, x);
              span.top = Math.min(span.top, y);
              span.bottom = Math.max(span.bottom, y);
            } else if (x >= title.left && x <= title.right && y >= title.top && y <= title.bottom) {
              titled += 1;
            } else {
              stray += 1;
            }
          }
        }
        const spans = ['left', 'right', 'top', 'bottom'].every(
          (side) => Math.abs(span[side] - box[side]) <= ringPx,
        );
        return { ring, title: titled, stray, box, span, placed: ring > 0 && titled > 0 && stray === 0 && spans };
      };

      /**
       * The comparison every composed layer shares: the four screenshots
       * decoded, each hidden one against its canvas read back, and the pixels
       * the layer adds between the backends.
       */
      const composedCompare = async (gpu, gl) => {
        const [gpuShown, gpuHidden, glShown, glHidden] = await Promise.all(
          [gpu.shown, gpu.hidden, gl.shown, gl.hidden].map(decodePng),
        );
        const frames = [gpuShown, gpuHidden, glShown, glHidden];
        const sameSize = frames.every((f) => f.width === gpuShown.width && f.height === gpuShown.height);
        if (!sameSize) return { sameSize, sizes: frames.map((f) => [f.width, f.height]) };
        const canvasMatched = {};
        for (const [backend, hidden] of [['webgpu', gpuHidden], ['webgl2', glHidden]]) {
          const read = composedCanvas[backend];
          let differing = 0;
          for (let i = 0; i < hidden.data.length; i += 4) if (pixelDelta(hidden.data, read, i) > 0) differing += 1;
          canvasMatched[backend] = read.length === hidden.data.length && differing === 0;
        }
        const composed = { differing: 0, maxDelta: 0 };
        const bare = { differing: 0, maxDelta: 0 };
        const added = { pixels: 0, maxDelta: 0 };
        for (let i = 0; i < gpuShown.data.length; i += 4) {
          const shownDelta = pixelDelta(gpuShown.data, glShown.data, i);
          const hiddenDelta = pixelDelta(gpuHidden.data, glHidden.data, i);
          if (shownDelta > 0) composed.differing += 1;
          if (hiddenDelta > 0) bare.differing += 1;
          composed.maxDelta = Math.max(composed.maxDelta, shownDelta);
          bare.maxDelta = Math.max(bare.maxDelta, hiddenDelta);
          if (shownDelta > 0 && hiddenDelta === 0) {
            added.pixels += 1;
            added.maxDelta = Math.max(added.maxDelta, shownDelta);
          }
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        const sound =
          backends.webgpu === 'webgpu' && backends.webgl2 === 'webgl2' && canvasMatched.webgpu && canvasMatched.webgl2;
        return { sameSize, backends, canvasMatched, sound, composed, bare, added, gpuShown, gpuHidden, glShown, glHidden };
      };

      window.groupParity = async ({
        gpu,
        gl,
        zoom = 1,
        dpr = 1,
        paddingShift = 0,
        expectedShift = 0,
        expectedZoom = zoom,
        expectedDpr = dpr,
      }) => {
        const compared = await composedCompare(gpu, gl);
        if (!compared.sameSize) return { pass: false, ...compared };
        const { gpuShown, gpuHidden, glShown, glHidden, ...common } = compared;
        const padding = GROUP.padding + expectedShift;
        const ringPx = groupRingDevicePx(dpr);
        const outline = {
          webgpu: outlineOf(gpuShown, gpuHidden, padding, expectedZoom, expectedDpr, ringPx),
          webgl2: outlineOf(glShown, glHidden, padding + paddingShift, expectedZoom, expectedDpr, ringPx),
        };
        const placed = outline.webgpu.placed && outline.webgl2.placed;
        return {
          pass: common.sound && placed && common.added.pixels === 0,
          ...common,
          zoom,
          dpr,
          paddingShift,
          expectedShift,
          expectedZoom,
          expectedDpr,
          placed,
          outline,
        };
      };

      /**
       * Rich-node tiers over the parity scene's first frame, composed with the
       * canvas on each backend as the group outline is.
       *
       * `createRichNodes` registers one `createHtmlOverlay` box entry per node
       * per tier, sized to the node's bounds and gated by its width on screen,
       * so the browser draws the tiers and either backend's camera places
       * them. Each tier here is one opaque colour with no text, so a pixel
       * names the tier that covers it. At zoom 1 the rectangle is 90 CSS
       * pixels wide and the circle 60, either side of the 75 pixel gate, so
       * the rectangle shows the card and the circle the label, and the bottom
       * tier (the shape alone, below 24) shows on neither.
       *
       * The comparison is the outline's: each hidden screenshot matches its
       * canvas, and between the backends the tiers may add no differing
       * pixel. On each backend, every pixel the layer changes lies within
       * `RICH_EDGE_DEVICE_PX` of a node's box, the changed pixels span each
       * box, and every pixel further inside a box than that holds the colour
       * of the tier `RICH_EXPECTED` names for its node.
       *
       * Three controls at zoom 1 and ratio 1. `boundsShift` moves every
       * node's box on the WebGL2 side by that much in x and y, and that side's expected boxes with it,
       * so it fails only on the difference the tiers add. `expectedShift`
       * widens the expected boxes on both sides, so it fails on
       * placement, and may fail on the colour with it, since a wider box takes
       * uncovered pixels into the colour test. `swapTiers` expects each node's tier on the other node, so
       * it fails only if the check can see which tier a node shows.
       *
       * At zoom 0.5 and 2 the canvas is drawn at that zoom and the overlay's
       * layer carries `scale(zoom)`, which the browser composes with each
       * box's own transform. The gates are read on screen, so at 0.5 both
       * nodes (45 and 30 pixels wide) show the label and at 2 both (180 and
       * 120) show the card. There `swapTiers` would expect what is already
       * expected, so `expectedZoom` stands in for it: it expects zoom 1's
       * tiers, and fails only if the check can see that the tiers follow the
       * zoom. Each control moves an edge 1.5 device pixels at every zoom:
       * `expectedShift` is in device pixels, and the runner passes
       * `boundsShift` as 1.5 / zoom world units.
       *
       * At device pixel ratio 2 the runner screenshots a page whose device
       * scale factor is 2, as for the outline. The overlay is laid out in CSS
       * pixels, so the expected boxes scale by the zoom times the ratio while
       * the gates, read in CSS pixels, pick zoom 1's tiers. The bounds and
       * placement controls run there too, still moving an edge 1.5 device
       * pixels, with `boundsShift` passed as 1.5 / ratio world units, and
       * `swapTiers` keeps its meaning. `expectedDpr` expects ratio 1's boxes,
       * so it fails only if the placement check can see that the tiers follow
       * the ratio.
       */
      const RICH_TIERS = [
        { name: 'label', color: 0xe63946, minScreenWidth: 24, maxScreenWidth: 75 },
        { name: 'card', color: 0x2a9d8f, minScreenWidth: 75 },
      ].map((tier) => ({
        ...tier,
        create: () => {
          const element = document.createElement('div');
          element.style.background = `#${tier.color.toString(16).padStart(6, '0')}`;
          return element;
        },
        update: () => {},
      }));
      const RICH_EXPECTED = {
        0.5: { rect: 'label', circle: 'label' },
        1: { rect: 'card', circle: 'label' },
        2: { rect: 'card', circle: 'card' },
      };
      // Every box edge lands on, or within half a device pixel of, a whole
      // device pixel, so one device pixel covers where a compositor rounds a
      // shifted box.
      const RICH_EDGE_DEVICE_PX = 1;

      const richBounds = (node, shift) => ({
        minX: node.center.x - node.size.width / 2 + shift,
        maxX: node.center.x + node.size.width / 2 + shift,
        minY: node.center.y - node.size.height / 2 + shift,
        maxY: node.center.y + node.size.height / 2 + shift,
      });

      window.richFrame = (backend, boundsShift = 0, zoom = 1, dpr = 1) =>
        composedFrame(
          backend,
          (camera, hold) => {
            const overlay = hold(createHtmlOverlay({ parent: document.getElementById('frame'), camera }));
            const rich = createRichNodes({ overlay, tiers: RICH_TIERS });
