            rich.setNodes(NODES.map((node) => ({ id: node.id, bounds: richBounds(node, boundsShift), data: null })));
            overlay.sync();
          },
          zoom,
          dpr,
        );

      // Where one backend's tiers changed its own frame, and in which colour,
      // against the boxes and tiers expected. `shift` is in world units and
      // `grow` in device pixels; `scale` is device pixels per world unit.
      const tiersOf = (shown, hidden, shift, grow, expected, scale) => {
        const { width, height } = shown;
        const margin = RICH_EDGE_DEVICE_PX;
        const nodes = NODES.map((node) => {
          const bounds = richBounds(node, shift);
          const tier = RICH_TIERS.find((each) => each.name === expected[node.id]);
          return {
            id: node.id,
            tier: tier.name,
            color: tier.color,
            box: {
              left: bounds.minX * scale + width / 2 - grow,
              right: bounds.maxX * scale + width / 2 + grow,
              top: height / 2 - bounds.maxY * scale - grow,
              bottom: height / 2 - bounds.minY * scale + grow,
            },
            span: { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity },
            changed: 0,
            inside: 0,
            colored: 0,
          };
        });
        let stray = 0;
        for (let row = 0; row < height; row += 1) {
          for (let col = 0; col < width; col += 1) {
            const i = (row * width + col) * 4;
            const x = col + 0.5;
            const y = row + 0.5;
            const within = (box, by) => x >= box.left - by && x <= box.right + by && y >= box.top - by && y <= box.bottom + by;
            for (const node of nodes) {
              if (!within(node.box, -margin)) continue;
              node.inside += 1;
              const matches = [16, 8, 0].every((s, c) => Math.abs(shown.data[i + c] - ((node.color >> s) & 0xff)) <= ROUNDING);
              if (matches) node.colored += 1;
            }
            if (pixelDelta(shown.data, hidden.data, i) === 0) continue;
            const node = nodes.find((each) => within(each.box, margin));
            if (node === undefined) {
              stray += 1;
              continue;
            }
            node.changed += 1;
            node.span.left = Math.min(node.span.left, x);
            node.span.right = Math.max(node.span.right, x);
            node.span.top = Math.min(node.span.top, y);
            node.span.bottom = Math.max(node.span.bottom, y);
          }
        }
        const placed =
          stray === 0 &&
          nodes.every(
            (node) =>
              node.changed > 0 &&
              ['left', 'right', 'top', 'bottom'].every((side) => Math.abs(node.span[side] - node.box[side]) <= margin),
          );
        const tiered = nodes.every((node) => node.inside > 0 && node.colored === node.inside);
        return { nodes, stray, placed, tiered };
      };

      window.richParity = async ({
        gpu,
        gl,
        zoom = 1,
        dpr = 1,
        boundsShift = 0,
        expectedShift = 0,
        swapTiers = false,
        expectedZoom = zoom,
        expectedDpr = dpr,
      }) => {
        const compared = await composedCompare(gpu, gl);
        if (!compared.sameSize) return { pass: false, ...compared };
        const { gpuShown, gpuHidden, glShown, glHidden, ...common } = compared;
        const atZoom = RICH_EXPECTED[expectedZoom];
        const expected = swapTiers ? { rect: atZoom.circle, circle: atZoom.rect } : atZoom;
        const tiers = {
          webgpu: tiersOf(gpuShown, gpuHidden, 0, expectedShift, expected, zoom * expectedDpr),
          webgl2: tiersOf(glShown, glHidden, boundsShift, expectedShift, expected, zoom * expectedDpr),
        };
        const placed = tiers.webgpu.placed && tiers.webgl2.placed;
        const tiered = tiers.webgpu.tiered && tiers.webgl2.tiered;
        return {
          pass: common.sound && placed && tiered && common.added.pixels === 0,
          ...common,
          zoom,
          dpr,
          boundsShift,
          expectedShift,
          swapTiers,
          expectedZoom,
          expectedDpr,
          placed,
          tiered,
          tiers,
        };
      };

      /**
       * M4.8b: `pickNode` swept over the canvas, against the answer the
       * shapes' own distance functions give.
       *
       * The scene is asymmetric in both axes, so a flipped row or column
       * names the wrong node or none, and one rectangle lies under the circle,
       * so draw order is checked as well: circles are drawn after rounded
       * rects, and the last shape drawn over a pixel is the one picked. A
       * pointer within one CSS pixel of any boundary is skipped, since the
       * device pixel it lands in can straddle that boundary.
       */
      const PICK_NODES = [
        ...NODES,
        { ...NODES[0], id: 'top-left', center: { x: -170, y: 110 }, size: { width: 60, height: 30 }, cornerRadius: 4 },
        { ...NODES[1], id: 'bottom-right', center: { x: 170, y: -110 }, size: { width: 40, height: 40 } },
        { ...NODES[0], id: 'under', center: { x: 60, y: 25 }, size: { width: 80, height: 30 }, cornerRadius: 0 },
      ];
      const PICK_DRAW_ORDER = [
        ...PICK_NODES.filter((node) => node.shape === 'roundedRect'),
        ...PICK_NODES.filter((node) => node.shape === 'circle'),
      ];
      const PICK_STEP_CSS_PX = 4;
      const PICK_MARGIN = 1;

      window.pickCheck = async (backend, devicePixelRatio, zoom = 1, center = { x: 0, y: 0 }, keep = false, staleCamera = false) => {
        const previous = document.getElementById('stage');
        const canvas = document.createElement('canvas');
        canvas.id = 'stage';
        previous.replaceWith(canvas);
        let renderer;
        try {
          renderer = await createRenderer({ canvas, backend, nodes: PICK_NODES });
        } catch (error) {
          return { backend, pass: false, error: String(error), code: error && error.code };
        }
        const viewport = { width: 480, height: 320, devicePixelRatio };
        renderer.camera.setViewport(viewport);
        renderer.camera.setZoom(zoom);
        renderer.camera.setCenter(center);
        renderer.render();
        const hits = Object.fromEntries([...PICK_NODES.map((node) => [node.id, 0]), ['background', 0]]);
        const mismatches = [];
        let checked = 0;
        let skipped = 0;
        const expectedZoom = staleCamera ? 1 : zoom;
        const expectedCenter = staleCamera ? { x: 0, y: 0 } : center;
        for (let cy = PICK_STEP_CSS_PX / 2; cy < viewport.height; cy += PICK_STEP_CSS_PX) {
          // A row's picks are in flight together, so a pick drawn while
          // another's readback is pending is checked too.
          const row = [];
          for (let cx = PICK_STEP_CSS_PX / 2; cx < viewport.width; cx += PICK_STEP_CSS_PX) {
            const x = expectedCenter.x + (cx - viewport.width / 2) / expectedZoom;
            const y = expectedCenter.y + (viewport.height / 2 - cy) / expectedZoom;
            let expected = null;
            let ambiguous = false;
            for (const node of PICK_DRAW_ORDER) {
              const d = signedDistance(node, x, y);
              if (Math.abs(d) * expectedZoom < PICK_MARGIN) ambiguous = true;
              if (d <= 0) expected = node.id;
            }
            if (ambiguous) {
              skipped += 1;
              continue;
            }
            const pointer = { x: cx, y: cy };
            row.push(renderer.pickNode(pointer).then((actual) => ({ pointer, expected, actual })));
          }
          for (const { pointer, expected, actual } of await Promise.all(row)) {
            checked += 1;
            hits[actual ?? 'background'] += 1;
            if (actual !== expected) mismatches.push({ pointer, expected, actual });
          }
        }
        const reported = renderer.backend;
        if (keep) window.disposePick = () => renderer.dispose();
        else renderer.dispose();
        const missed = PICK_NODES.filter((node) => hits[node.id] === 0).map((node) => node.id);
        return {
          backend,
          reported,
          devicePixelRatio,
          pass: reported === backend && mismatches.length === 0 && missed.length === 0,
          zoom,
          center,
          checked,
          skipped,
          mismatchCount: mismatches.length,
          mismatches: mismatches.slice(0, 5),
          hits,
        };
      };

      window.ready = true;
    </script>
  </body>
</html>
