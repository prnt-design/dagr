<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@prnt/dagr-render backend probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      /*
        The CSS box and the drawing buffer are both stated, at device pixel
        ratio 1, so the screenshot this produces is comparable to the rest of
        assets/screenshots/ and so a stretched canvas cannot be mistaken for a
        rendering difference between the backends.
      */
      #stage {
        width: 480px;
        height: 320px;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <!--
      An import map rather than a bundler. The two specifiers @prnt/dagr-render's
      dist actually uses are three/webgpu and three/tsl, and the runner rewrites
      both to the paths its own `require.resolve` found, so this page never
      names a pnpm directory and never goes stale against a three upgrade.
    -->
    <script type="importmap">
      { "imports": { "three/webgpu": "__THREE_WEBGPU__", "three/tsl": "__THREE_TSL__" } }
    </script>
    <script type="module">
      import { createRenderer } from '/packages/render/dist/index.js';

      /**
       * The M4.2 shape ladder reduced to two shapes, one from each family.
       *
       * Two rather than six because what this page asks is whether the TSL
       * graphs COMPILE and draw on a backend, and the two families are two
       * meshes with two materials and therefore two pipelines. A third
       * rounded rect would exercise nothing a second instance of the first
       * does not.
       */
      const NODES = [
        {
          id: 'rect',
          shape: 'roundedRect',
          center: { x: -60, y: 0 },
          size: { width: 90, height: 50 },
          cornerRadius: 10,
          fillColor: 0xffb703,
          glowColor: 0xfb8500,
          glowWorld: 8,
        },
        {
          id: 'circle',
          shape: 'circle',
          center: { x: 60, y: 0 },
          size: { width: 60, height: 60 },
          cornerRadius: 0,
          fillColor: 0x8ecae6,
          glowColor: 0x219ebc,
          glowWorld: 8,
        },
      ];

      /**
       * The area each fill should cover, in device pixels, from the same
       * records the renderer is given.
       *
       * **This is what turns "it drew" into "it drew the right thing at the
       * right size".** A count of amber pixels says a shape is there; a count
       * that matches the area of a 90 by 50 rounded rectangle says it is THAT
       * shape. Derived here rather than written as a constant, and derived from
       * NODES rather than from a copy of its numbers, because a hand copy that
       * drifts is the trap card-heights.mjs already paid for.
       *
       * The inset is the outline. `outlinePixels` is 2 DEVICE pixels drawn
       * inside the boundary in the scene's outline colour, so the fill is the
       * shape shrunk by 2 on every side, and the corner radius shrinks with it.
       * At device pixel ratio 1 a world unit is a device pixel at zoom 1, which
       * is the view this page uses and states.
       *
       * Boundary pixels are blended toward the halo and fail the hue test, so
       * the count runs slightly UNDER the area rather than over it, and by more
       * on the circle than on the rectangle because a circle of this size is
       * almost all boundary.
       */
      const OUTLINE_DEVICE_PX = 2;
      const expectedFillArea = (node) => {
        const inset = OUTLINE_DEVICE_PX * 2;
        const width = node.size.width - inset;
        const height = node.size.height - inset;
        if (node.shape === 'circle') return Math.PI * (width / 2) * (height / 2);
        const radius = Math.max(0, node.cornerRadius - OUTLINE_DEVICE_PX);
        return width * height - (4 - Math.PI) * radius * radius;
      };

      // The drawn canvas holds a WebGL or WebGPU context, so it has no 2d
      // context to read pixels out of. The reading happens through a second
      // canvas the drawn one is copied into, which is what a screenshot does
      // anyway.
      const readPixels = (canvas) => {
        const scratch = document.createElement('canvas');
        scratch.width = canvas.width;
        scratch.height = canvas.height;
        const ctx = scratch.getContext('2d');
        ctx.drawImage(canvas, 0, 0);
        return ctx.getImageData(0, 0, scratch.width, scratch.height).data;
      };

      /**
       * Builds a renderer under one preference, draws one frame, and counts
       * what reached the canvas.
       *
       * The pixel counts are the point. "It drew" asserted from the absence of
       * a thrown error is a claim an empty canvas satisfies, which is the trap
       * D1's entry already names about the demo's own check ("the DOM tiers are
       * satisfied by a blank canvas"), so this reads the drawing buffer back and
       * counts pixels that are not the clear colour, plus the two fills it
       * should be able to find by hue and compare against their own areas.
       */
      window.probe = async (backend, keep = false) => {
        // A FRESH canvas per run, which the first version of this page did not
        // do and paid for: a canvas holds one context for its whole life, so
        // the second `createRenderer` on the same element came back with a
        // TypeError out of three rather than with anything about backends. That
        // is a fact about canvases rather than about this package, and it is
        // worth the four lines here because the probe's whole job is to be
        // three independent runs.
        const previous = document.getElementById('stage');
        const canvas = document.createElement('canvas');
        canvas.id = 'stage';
        previous.replaceWith(canvas);
        const viewport = { width: 480, height: 320, devicePixelRatio: 1 };
        let renderer;
        try {
          renderer = await createRenderer({ canvas, backend, nodes: NODES });
        } catch (error) {
          return { backend, ok: false, error: String(error), code: error && error.code };
        }
        renderer.camera.setViewport(viewport);
        renderer.render();
        const data = readPixels(canvas);
        let lit = 0;
        let amber = 0;
        let blue = 0;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          // The clear colour is 0x0b0d10. Anything meaningfully above it came
          // from a shape, and the two fills are separable by which channel
          // dominates: 0xffb703 is red over blue, 0x8ecae6 is blue over red.
          if (r + g + b > 0x0b + 0x0d + 0x10 + 24) lit += 1;
          if (r > 200 && g > 140 && b < 80) amber += 1;
          if (b > 200 && r < 200 && g > 180) blue += 1;
        }
        const reported = renderer.backend;
        // `keep` leaves the renderer alive so the caller can screenshot the
        // canvas, and the default does not. Disposing releases the context and
        // the canvas goes blank, which cost this file one committed screenshot
        // of an empty frame under a caption that said otherwise: the pixel
        // counts above were taken before the dispose and were right, and the
        // image taken after it was white. Counting and looking are two checks.
        if (!keep) renderer.dispose();
        return {
          backend,
          ok: true,
          reported,
          drawingBuffer: { width: canvas.width, height: canvas.height },
          lit,
          amber,
          blue,
          expected: {
            amber: Math.round(expectedFillArea(NODES[0])),
            blue: Math.round(expectedFillArea(NODES[1])),
          },
        };
      };

      /**
       * What a capability probe before `init()` would have said, against what
       * asking for an adapter actually gives.
       *
       * This pair is the reason `backend.ts` reads the backend AFTER `init()`
       * rather than probing before it, so the page reports both halves rather
       * than the conclusion.
       */
      window.webgpuAdvertised = async () => {
        if (!('gpu' in navigator)) return { navigatorGpu: false, adapter: null };
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter === null) return { navigatorGpu: true, adapter: null };
        const { vendor, architecture, device, description } = adapter.info;
        return {
          navigatorGpu: true,
          adapter: {
            vendor,
            architecture,
            device,
            description,
            isFallbackAdapter: adapter.info.isFallbackAdapter ?? adapter.isFallbackAdapter,
          },
        };
      };

      /**
       * M4.9b: the same scene through WebGPU and WebGL2, compared pixel by
       * pixel, with the tolerance taken from the antialiasing ramp.
       *
       * `fillCoverage` and `outlineCoverage` in `sdf.ts` are smoothsteps one
       * `aaWidth` wide, centred on the shape's boundary and on the outline's
       * inner edge. `aaWidth` comes from screen-space derivatives, the one
       * input the two backends may compute differently; it is one device
       * pixel here. A pixel centre more than one device pixel from both edges
       * has coverage exactly 0 or 1 for any `aaWidth` up to 1.2 (the inner
       * edge sits at `outlinePixels * aaWidth`, so it moves with the width
       * too), and the glow ignores `aaWidth` while `glowWorld` exceeds it. The
       * rest of that pixel's colour is the same arithmetic on both backends,
       * expected to differ by 8-bit rounding at most. Inside the band any
       * difference is allowed and counted.
       *
       * `shiftX` moves the first node on the WebGL2 side only. It is the
       * control and must fail. A sub-pixel shift moves the fill and outline
       * edges only within the band, so it is the glow's gradient that catches
       * it; a shape without glow shifted the same way would pass.
       */
      const EDGE_BAND_DEVICE_PX = 1;
      const ROUNDING = 1;

      const signedDistance = (node, x, y) => {
        const px = x - node.center.x;
        const py = y - node.center.y;
        if (node.shape === 'circle') return Math.hypot(px, py) - node.size.width / 2;
        const r = node.cornerRadius;
        const qx = Math.abs(px) - node.size.width / 2 + r;
        const qy = Math.abs(py) - node.size.height / 2 + r;
        return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
      };

      window.parity = async (shiftX = 0) => {
        const draw = async (backend, nodes) => {
          const previous = document.getElementById('stage');
          const canvas = document.createElement('canvas');
          canvas.id = 'stage';
          previous.replaceWith(canvas);
          const renderer = await createRenderer({ canvas, backend, nodes });
          renderer.camera.setViewport({ width: 480, height: 320, devicePixelRatio: 1 });
          renderer.render();
          const data = readPixels(canvas);
          const reported = renderer.backend;
          renderer.dispose();
          return { data, reported, width: canvas.width, height: canvas.height };
        };
        const shifted = NODES.map((node, i) =>
          i === 0 ? { ...node, center: { x: node.center.x + shiftX, y: node.center.y } } : node,
        );
        let gpu;
        let gl;
        try {
          gpu = await draw('webgpu', NODES);
          gl = await draw('webgl2', shifted);
        } catch (error) {
          return { pass: false, error: String(error), code: error && error.code };
        }
        const band = { pixels: 0, differing: 0, maxDelta: 0 };
        const interior = { pixels: 0, differing: 0, maxDelta: 0 };
        for (let row = 0; row < gpu.height; row += 1) {
          for (let col = 0; col < gpu.width; col += 1) {
            // Device pixel centres in world units: zoom 1, DPR 1, the origin at
            // the canvas centre. Both shapes are symmetric in y, so the sign of
            // the y axis does not matter here.
            const x = col + 0.5 - gpu.width / 2;
            const y = gpu.height / 2 - (row + 0.5);
            let nearest = Infinity;
            for (const node of NODES) {
              const d = signedDistance(node, x, y);
              nearest = Math.min(nearest, Math.abs(d), Math.abs(d + OUTLINE_DEVICE_PX));
            }
            const i = (row * gpu.width + col) * 4;
            const delta = Math.max(
              Math.abs(gpu.data[i] - gl.data[i]),
              Math.abs(gpu.data[i + 1] - gl.data[i + 1]),
              Math.abs(gpu.data[i + 2] - gl.data[i + 2]),
              Math.abs(gpu.data[i + 3] - gl.data[i + 3]),
            );
            const bucket = nearest < EDGE_BAND_DEVICE_PX ? band : interior;
            bucket.pixels += 1;
            if (delta > 0) bucket.differing += 1;
            bucket.maxDelta = Math.max(bucket.maxDelta, delta);
          }
        }
        const backends = { webgpu: gpu.reported, webgl2: gl.reported };
        return {
          pass:
            gpu.reported === 'webgpu' &&
            gl.reported === 'webgl2' &&
            gl.width === gpu.width &&
            gl.height === gpu.height &&
            interior.maxDelta <= ROUNDING,
          backends,
          tolerance: { edgeBandDevicePx: EDGE_BAND_DEVICE_PX, interiorMaxDelta: ROUNDING },
          shiftX,
          band,
          interior,
        };
      };

      /**
       * M4.8b: `pickNode` swept over the canvas, against the answer the
       * shapes' own distance functions give.
       *
       * The scene is asymmetric in both axes, so a flipped row or column
       * names the wrong node or none, and one rectangle lies under the circle,
       * so draw order is checked as well: circles are drawn after rounded
       * rects, and the last shape drawn over a pixel is the one picked. A
       * pointer within one world unit of any boundary is skipped, since the
       * device pixel it lands in can straddle that boundary.
       */
      const PICK_NODES = [
        ...NODES,
        { ...NODES[0], id: 'top-left', center: { x: -170, y: 110 }, size: { width: 60, height: 30 }, cornerRadius: 4 },
        { ...NODES[1], id: 'bottom-right', center: { x: 170, y: -110 }, size: { width: 40, height: 40 } },
        { ...NODES[0], id: 'under', center: { x: 60, y: 25 }, size: { width: 80, height: 30 }, cornerRadius: 0 },
      ];
      const PICK_DRAW_ORDER = [
        ...PICK_NODES.filter((node) => node.shape === 'roundedRect'),
        ...PICK_NODES.filter((node) => node.shape === 'circle'),
      ];
      const PICK_STEP_CSS_PX = 4;
      const PICK_MARGIN = 1;

      window.pickCheck = async (backend, devicePixelRatio) => {
        const previous = document.getElementById('stage');
        const canvas = document.createElement('canvas');
        canvas.id = 'stage';
        previous.replaceWith(canvas);
        let renderer;
        try {
          renderer = await createRenderer({ canvas, backend, nodes: PICK_NODES });
        } catch (error) {
          return { backend, pass: false, error: String(error), code: error && error.code };
        }
        const viewport = { width: 480, height: 320, devicePixelRatio };
        renderer.camera.setViewport(viewport);
        renderer.render();
        const hits = Object.fromEntries([...PICK_NODES.map((node) => [node.id, 0]), ['background', 0]]);
        const mismatches = [];
        let checked = 0;
        let skipped = 0;
        for (let cy = PICK_STEP_CSS_PX / 2; cy < viewport.height; cy += PICK_STEP_CSS_PX) {
          // A row's picks are in flight together, so a pick drawn while
          // another's readback is pending is checked too.
          const row = [];
          for (let cx = PICK_STEP_CSS_PX / 2; cx < viewport.width; cx += PICK_STEP_CSS_PX) {
            const x = cx - viewport.width / 2;
            const y = viewport.height / 2 - cy;
            let expected = null;
            let ambiguous = false;
            for (const node of PICK_DRAW_ORDER) {
              const d = signedDistance(node, x, y);
              if (Math.abs(d) < PICK_MARGIN) ambiguous = true;
              if (d <= 0) expected = node.id;
            }
            if (ambiguous) {
              skipped += 1;
              continue;
            }
            const pointer = { x: cx, y: cy };
            row.push(renderer.pickNode(pointer).then((actual) => ({ pointer, expected, actual })));
          }
          for (const { pointer, expected, actual } of await Promise.all(row)) {
            checked += 1;
            hits[actual ?? 'background'] += 1;
            if (actual !== expected) mismatches.push({ pointer, expected, actual });
          }
        }
        const reported = renderer.backend;
        renderer.dispose();
        const missed = PICK_NODES.filter((node) => hits[node.id] === 0).map((node) => node.id);
        return {
          backend,
          reported,
          devicePixelRatio,
          pass: reported === backend && mismatches.length === 0 && missed.length === 0,
          checked,
          skipped,
          mismatchCount: mismatches.length,
          mismatches: mismatches.slice(0, 5),
          hits,
        };
      };

      window.ready = true;
    </script>
  </body>
</html>
