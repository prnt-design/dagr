<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@prnt/dagr-render frame profile</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #host {
        position: relative;
        width: 1280px;
        height: 720px;
      }
      #stage {
        width: 1280px;
        height: 720px;
        display: block;
      }
      .tier-label {
        transform-origin: 0 0;
        transform: scale(var(--dagr-overlay-inv-zoom, 1));
        padding: 2px 6px;
        background: rgba(7, 8, 10, 0.82);
        color: #d7dbe1;
        font: 12px ui-monospace, monospace;
        white-space: nowrap;
      }
      .tier-card {
        box-sizing: border-box;
        padding: 4px 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(7, 8, 10, 0.9);
        color: #d7dbe1;
        font: 8px ui-sans-serif, sans-serif;
        overflow: hidden;
      }
      .tier-card b {
        display: block;
        color: #ffb703;
      }
    </style>
  </head>
  <body>
    <div id="host"><canvas id="stage"></canvas></div>
    <script type="importmap">
      { "imports": { "three/webgpu": "__THREE_WEBGPU__", "three/tsl": "__THREE_TSL__" } }
    </script>
    <script type="module">
      import {
        advanceDashFlow,
        createHtmlOverlay,
        createRenderer,
        createRichNodes,
        createSceneMotion,
      } from '/packages/render/dist/index.js';
      // The module file rather than the package index, which imports React.
      import { createNodeHitIndex } from '/packages/react/dist/node-hit.js';

      const SPACING = { x: 130, y: 90 };
      const SWAY_WORLD = 20;
      const EDGE_COLOR = 0x5a6b7d;
      const DASH = { periodPixels: 8, duty: 0.5, speedPixelsPerSecond: 40 };
      const BEND_WORLD = 25;
      // DagrCanvas's mouse tolerance, in CSS pixels.
      const POINTER_HIT_PIXELS = 4;

      // A two-point route has nothing for 'smooth' to curve through, so smooth
      // edges get a bend point pushed sideways off the chord's middle.
      const EDGE_STYLES = {
        straight: { group: { style: { halfWidthPixels: 1 } }, bend: false },
        dashed: { group: { style: { halfWidthPixels: 1, dash: DASH } }, bend: false },
        smooth: { group: { style: { halfWidthPixels: 1 }, curve: 'smooth' }, bend: true },
      };

      /**
       * A grid of alternating rounded rectangles and circles, each joined to
       * the node below it and every third one also to the node below and to
       * the right: about 1.3 edges per node, the ratio of the explorer
       * ceiling's generated graphs.
       */
      const buildGraph = (count) => {
        const columns = Math.ceil(Math.sqrt(count * 1.5));
        const home = [];
        for (let i = 0; i < count; i += 1) {
          home.push({ x: (i % columns) * SPACING.x, y: -Math.floor(i / columns) * SPACING.y });
        }
        const links = [];
        for (let i = 0; i < count; i += 1) {
          const below = i + columns;
          if (below < count) links.push([i, below]);
          if (i % 3 === 0 && below + 1 < count && (i % columns) + 1 < columns) {
            links.push([i, below + 1]);
          }
        }
        const last = home[count - 1];
        const bounds = {
          minX: -SPACING.x,
          minY: last.y - SPACING.y,
          maxX: columns * SPACING.x,
          maxY: SPACING.y,
        };
        return { home, links, bounds };
      };

      const nodesAt = (centres) =>
        centres.map((center, i) =>
          i % 2 === 0
            ? {
                id: `n${i}`,
                shape: 'roundedRect',
                center,
                size: { width: 90, height: 50 },
                cornerRadius: 10,
                fillColor: 0xffb703,
                glowColor: 0xfb8500,
                glowWorld: 6,
              }
            : {
                id: `n${i}`,
                shape: 'circle',
                center,
                size: { width: 50, height: 50 },
                fillColor: 0x8ecae6,
                glowColor: 0x219ebc,
                glowWorld: 6,
              },
        );

      const edgesAt = (centres, links, bend) =>
        links.map(([from, to]) => {
          const a = centres[from];
          const b = centres[to];
          const points = bend
            ? [a, { x: (a.x + b.x) / 2 + BEND_WORLD, y: (a.y + b.y) / 2 }, b]
            : [a, b];
          return { id: `e${from}-${to}`, points, color: EDGE_COLOR };
        });

      // M4.12's gates: the shape alone below 24 CSS pixels, a title label to
      // 160, a card above.
      const parts = new WeakMap();
      const TIERS = [
        {
          name: 'label',
          minScreenWidth: 24,
          maxScreenWidth: 160,
          create: () => {
            const element = document.createElement('div');
            element.className = 'tier-label';
            return element;
          },
          update: (element, node) => {
            element.textContent = node.data.title;
          },
        },
        {
          name: 'card',
          minScreenWidth: 160,
          create: () => {
            const element = document.createElement('div');
            element.className = 'tier-card';
            const title = document.createElement('b');
            const kind = document.createElement('div');
            const links = document.createElement('div');
            element.append(title, kind, links);
            parts.set(element, { title, kind, links });
            return element;
          },
          update: (element, node) => {
            const { title, kind, links } = parts.get(element);
            title.textContent = node.data.title;
            kind.textContent = node.data.kind;
            links.textContent = node.data.links;
          },
        },
      ];

      const richDataFor = (count, links) => {
        const degree = new Array(count).fill(0);
        for (const [from, to] of links) {
          degree[from] += 1;
          degree[to] += 1;
        }
        return degree.map((d, i) => ({
          title: `node ${i}`,
          kind: i % 2 === 0 ? 'rounded rectangle' : 'circle',
          links: `${d} edges`,
        }));
      };

      const boundsOf = (node) => ({
        minX: node.center.x - node.size.width / 2,
        maxX: node.center.x + node.size.width / 2,
        minY: node.center.y - node.size.height / 2,
        maxY: node.center.y + node.size.height / 2,
      });

      const swayed = (home, t) =>
        home.map((p, i) => ({ x: p.x + SWAY_WORLD * Math.sin(t * 0.004 + i * 0.37), y: p.y }));

      // With the default 0.12 s half-life a 20 world unit move takes about a
      // second to come to rest, so retargeting every half second keeps every
      // retargeted spring in flight on every frame.
      const RETARGET_MS = 500;

      /**
       * The animated mode's source of node centres and edge routes each frame.
       * `sway` computes them from the clock. `springs` hands a new target
       * through `createSceneMotion` every `RETARGET_MS` and draws what
       * `advance` returns, the way `DagrCanvas`'s animation frame does. It
       * retargets the first `moving` share of the nodes in row order, a
       * contiguous block as a local edit would move, and every edge touching
       * one of them; the rest stay at rest on their first routes.
       */
      const motionSource = (kind, home, links, bend, bounds, moving) => {
        if (kind === 'sway') {
          return {
            next: (ts, timings) => {
              const t0 = performance.now();
              const centres = swayed(home, ts);
              const nodes = nodesAt(centres);
              const edges = edgesAt(centres, links, bend);
              timings.input = performance.now() - t0;
              return { nodes, edges };
            },
            stats: () => null,
          };
        }
        if (kind !== 'springs') throw new Error(`no motion ${kind}`);
        const templates = new Map(nodesAt(home).map((node) => [node.id, node]));
        const targetsAt = (centres) => ({
          nodes: centres.map((center, i) => ({ id: `n${i}`, center })),
          edges: edgesAt(centres, links, bend).map(({ id, points }) => ({ id, points })),
        });
        const movingNodes = Math.round(moving * home.length);
        const movingLinks = links.flatMap(([from, to], i) =>
          from < movingNodes || to < movingNodes ? [i] : [],
        );
        const motion = createSceneMotion();
        const start = targetsAt(home);
        motion.resync({ nodes: start.nodes, edges: start.edges, bounds });
        let lastRetarget = null;
        let previousTs = null;
        let frames = 0;
        let settledFrames = 0;
        let retargets = 0;
        return {
          next: (ts, timings) => {
            if (lastRetarget === null || ts - lastRetarget >= RETARGET_MS) {
              const swayedNow = swayed(home, ts);
              const target = targetsAt(
                movingNodes === home.length ? swayedNow : home.map((p, i) => (i < movingNodes ? swayedNow[i] : p)),
              );
              const moved = movingNodes === home.length ? target.nodes : target.nodes.slice(0, movingNodes);
              const rerouted =
                movingLinks.length === links.length ? target.edges : movingLinks.map((i) => target.edges[i]);
              const t0 = performance.now();
              motion.apply({
                nodes: { added: [], removed: [], moved },
                edges: { added: [], removed: [], rerouted },
              });
              timings.apply = performance.now() - t0;
              lastRetarget = ts;
              retargets += 1;
            }
            const dt = previousTs === null ? 0 : Math.max(0, ts - previousTs) / 1000;
            previousTs = ts;
            const t1 = performance.now();
            const frame = motion.advance(dt);
            const t2 = performance.now();
            const nodes = frame.nodes.map((node) => ({ ...templates.get(node.id), center: node.center }));
            const edges = frame.edges.map(({ id, points }) => ({ id, points, color: EDGE_COLOR }));
            timings.advance = t2 - t1;
            timings.input = performance.now() - t2;
            frames += 1;
            if (frame.settled) settledFrames += 1;
            return { nodes, edges };
          },
          stats: () => ({
            frames,
            settledFrames,
            retargets,
            movingNodes,
            movingEdges: movingLinks.length,
          }),
        };
      };

      // A pointer sweeping the viewport, so queries land on nodes and
      // background alike.
      const pointerAt = (ts) => ({
        x: 640 + 600 * Math.sin(ts * 0.0011),
        y: 360 + 340 * Math.sin(ts * 0.0017),
      });

      const heap = () =>
        performance.memory === undefined ? null : performance.memory.usedJSHeapSize;

      // GPU time of every pass the renderer encodes, from timestamp queries
      // the page adds to each pass descriptor three hands the device. A frame
      // tag set before each sampled frame says which frame a reading belongs
      // to, since readings arrive after the frame that submitted them.
      //
      // Only a pass's end minus its own beginning is used. In Chrome 155 on an
      // Apple M4, timestamps from different command buffers were not in
      // submission order, and a pass with no draw call got an end of 0.
      const gpuTiming = { frame: -1, submits: 0, readings: [], pending: new Set(), untimed: [] };
      const SLOT_QUERIES = 32;
      window.timeGpuPasses = () => {
        const encoders = new WeakMap();
        const submitted = new WeakMap();
        const pools = new WeakMap();
        const takeSlot = (device) => {
          let pool = pools.get(device);
          if (pool === undefined) pools.set(device, (pool = []));
          return (
            pool.pop() ?? {
              device,
              querySet: device.createQuerySet({ type: 'timestamp', count: SLOT_QUERIES }),
              resolve: device.createBuffer({
                size: SLOT_QUERIES * 8,
                usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC,
              }),
              read: device.createBuffer({
                size: SLOT_QUERIES * 8,
                usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
              }),
            }
          );
        };
        const createCommandEncoder = GPUDevice.prototype.createCommandEncoder;
        GPUDevice.prototype.createCommandEncoder = function (descriptor) {
          const encoder = createCommandEncoder.call(this, descriptor);
          encoders.set(encoder, { device: this, label: descriptor?.label ?? '', passes: [], slot: null });
          return encoder;
        };
        const timePass = (method, kind) => {
          const original = GPUCommandEncoder.prototype[method];
          GPUCommandEncoder.prototype[method] = function (descriptor = {}) {
            const info = encoders.get(this);
            const why =
              info === undefined
                ? 'encoder not seen'
                : !info.device.features.has('timestamp-query')
                  ? 'device has no timestamp-query'
                  : descriptor.timestampWrites !== undefined
                    ? 'pass already writes timestamps'
                    : info.passes.length * 2 + 2 > SLOT_QUERIES
                      ? 'more passes than the slot holds'
                      : null;
            if (why !== null) {
              gpuTiming.untimed.push({ kind, why });
              return original.call(this, descriptor);
            }
            info.slot ??= takeSlot(info.device);
            const index = info.passes.length * 2;
            const colors = descriptor.colorAttachments ?? [];
            info.passes.push({
              kind,
              encoder: info.label,
              resolves: colors.some((c) => c?.resolveTarget !== undefined),
              depth: descriptor.depthStencilAttachment !== undefined,
            });
            // A copy, because three caches its descriptors and reuses them.
            return original.call(this, {
              ...descriptor,
              timestampWrites: {
                querySet: info.slot.querySet,
                beginningOfPassWriteIndex: index,
                endOfPassWriteIndex: index + 1,
              },
            });
          };
        };
        timePass('beginRenderPass', 'render');
        timePass('beginComputePass', 'compute');
        const finish = GPUCommandEncoder.prototype.finish;
        GPUCommandEncoder.prototype.finish = function (descriptor) {
          const info = encoders.get(this);
          if (info?.slot != null) {
            const bytes = info.passes.length * 16;
            this.resolveQuerySet(info.slot.querySet, 0, info.passes.length * 2, info.slot.resolve, 0);
            this.copyBufferToBuffer(info.slot.resolve, 0, info.slot.read, 0, bytes);
          }
          const buffer = finish.call(this, descriptor);
          if (info?.slot != null) submitted.set(buffer, { ...info, frame: gpuTiming.frame });
          return buffer;
        };
        const submit = GPUQueue.prototype.submit;
        GPUQueue.prototype.submit = function (buffers) {
          const result = submit.call(this, buffers);
          for (const buffer of buffers) {
            const info = submitted.get(buffer);
            if (info === undefined) continue;
            const { slot } = info;
            const order = gpuTiming.submits++;
            const read = slot.read.mapAsync(GPUMapMode.READ).then(() => {
              const ticks = new BigInt64Array(slot.read.getMappedRange().slice(0, info.passes.length * 16));
              slot.read.unmap();
              pools.get(slot.device).push(slot);
              for (const [i, pass] of info.passes.entries()) {
                gpuTiming.readings.push({
                  ...pass,
                  order: order + i / SLOT_QUERIES,
                  frame: info.frame,
                  beginNs: ticks[i * 2],
                  endNs: ticks[i * 2 + 1],
                });
              }
            });
            gpuTiming.pending.add(read);
            read.finally(() => gpuTiming.pending.delete(read));
          }
          return result;
        };
      };

      // The frames `sample` timed, each as its passes in submission order.
      const gpuFrames = async () => {
        while (gpuTiming.pending.size > 0) await Promise.all([...gpuTiming.pending]);
        const frames = new Map();
        for (const reading of gpuTiming.readings) {
          if (reading.frame < 0) continue;
          if (!frames.has(reading.frame)) frames.set(reading.frame, []);
          frames.get(reading.frame).push(reading);
        }
        // Chrome rounds timestamps unless WebGPU developer features are on,
        // so the largest power of two dividing every tick is the resolution.
        let grainNs = null;
        for (const { beginNs, endNs } of gpuTiming.readings) {
          for (const t of [beginNs, endNs]) {
            if (t <= 0n) continue;
            const grain = t & -t;
            if (grainNs === null || grain < grainNs) grainNs = grain;
          }
        }
        const untimed = gpuTiming.untimed;
        gpuTiming.readings = [];
        gpuTiming.untimed = [];
        gpuTiming.frame = -1;
        return {
          untimed,
          grainNs: grainNs === null ? null : Number(grainNs),
          frames: [...frames.values()].map((passes) =>
            passes
              .sort((a, b) => a.order - b.order)
              .map(({ kind, encoder, resolves, depth, beginNs, endNs }) => ({
                kind,
                encoder,
                resolves,
                depth,
                ms: endNs > beginNs && beginNs > 0n ? Number(endNs - beginNs) / 1e6 : null,
              })),
          ),
        };
      };

      const freshCanvas = () => {
        const canvas = document.createElement('canvas');
        canvas.id = 'stage';
        document.getElementById('stage').replaceWith(canvas);
        return canvas;
      };

      /**
       * Runs `frames` animation frames after `warmup`, calling `work(ts)`
       * inside each one, and returns the interval between frames and the
       * time each named step of `work` took.
       */
      const sample = (warmup, frames, work) =>
        new Promise((resolve) => {
          const intervals = [];
          const steps = {};
          let previous = null;
          let seen = 0;
          const tick = (ts) => {
            if (previous !== null && seen >= warmup) intervals.push(ts - previous);
            previous = ts;
            gpuTiming.frame = seen >= warmup ? seen : -1;
            const timings = work(ts);
            gpuTiming.frame = -1;
            if (seen >= warmup) {
              for (const [name, ms] of Object.entries(timings)) (steps[name] ??= []).push(ms);
            }
            seen += 1;
            if (intervals.length < frames) requestAnimationFrame(tick);
            else resolve({ intervals, steps });
          };
          requestAnimationFrame(tick);
        });

      // A page that paints nothing new gets fewer frames from Chrome, so the
      // control moves one square a frame, like the profiled pages do.
      window.control = (warmup, frames) => {
        const ctx = freshCanvas().getContext('2d');
        let x = 0;
        return sample(warmup, frames, () => {
          ctx.clearRect(x, 0, 8, 8);
          x = (x + 1) % 64;
          ctx.fillRect(x, 0, 8, 8);
          return {};
        });
      };

      // `still` is the cost of holding the graph on screen, without a camera
      // move's own cost.
      // `parts` draws the nodes, the edges or both, so a pass's GPU time can
      // be split between them by subtraction.
      window.profile = async (count, warmup, frames, zoom, edgeStyle, nodeMode, hit, parts, motion, moving) => {
        const { group, bend } = EDGE_STYLES[edgeStyle];
        const drawNodes = parts === 'all' || parts === 'nodes';
        const drawEdges = parts === 'all' || parts === 'edges';
        const { home, links, bounds } = buildGraph(count);
        const richData = nodeMode === 'rich' ? richDataFor(count, links) : null;
        const heapBefore = heap();
        const buildStart = performance.now();
        const renderer = await createRenderer({
          canvas: freshCanvas(),
          backend: 'webgpu',
          nodes: drawNodes ? nodesAt(home) : [],
          edgeGroups: [{ id: 'edges', ...group }],
        });
        if (drawEdges) renderer.setEdges('edges', edgesAt(home, links, bend));
        renderer.camera.setViewport({ width: 1280, height: 720, devicePixelRatio: window.devicePixelRatio });
        renderer.camera.fitBounds(bounds);
        if (zoom !== null) renderer.camera.setZoom(zoom);
        let overlay = null;
        let rich = null;
        if (richData !== null) {
          overlay = createHtmlOverlay({ parent: document.getElementById('host'), camera: renderer.camera });
          rich = createRichNodes({ overlay, tiers: TIERS });
          rich.setNodes(
            nodesAt(home).map((node, i) => ({ id: node.id, bounds: boundsOf(node), data: richData[i] })),
          );
          overlay.sync();
        }
        renderer.render();
        const buildMs = performance.now() - buildStart;
        const heapBuilt = heap();

        // DagrCanvas caches the index by the identity of the drawn array, so a
        // still scene builds it once and every pointer move is a query.
        const hits = { still: { queries: 0, onNode: 0 }, animated: { queries: 0, onNode: 0 } };
        const query = (index, ts, mode) => {
          const t0 = performance.now();
          const world = renderer.camera.screenToWorld(pointerAt(ts));
          const id = index.hit(world, POINTER_HIT_PIXELS / renderer.camera.zoom);
          const ms = performance.now() - t0;
          hits[mode].queries += 1;
          if (id !== null) hits[mode].onNode += 1;
          return ms;
        };
        let stillIndex = null;
        let hitIndexMs = null;
        if (hit) {
          const t0 = performance.now();
          stillIndex = createNodeHitIndex(nodesAt(home));
          hitIndexMs = performance.now() - t0;
        }

        const still = await sample(warmup, frames, (ts) => {
          const timings = {};
          if (stillIndex !== null) timings.hit = query(stillIndex, ts, 'still');
          if (overlay !== null) {
            const t0 = performance.now();
            overlay.sync();
            timings.sync = performance.now() - t0;
          }
          const start = performance.now();
          renderer.render();
          timings.render = performance.now() - start;
          return timings;
        });
        const stillGpu = await gpuFrames();
        const stillElements = overlay === null ? null : overlay.activeCount;
        let flowPixels = 0;
        let previousTs = null;
        const source = motionSource(motion, home, links, bend, bounds, moving);
        const animated = await sample(warmup, frames, (ts) => {
          const timings = {};
          const { nodes, edges } = source.next(ts, timings);
          const t1 = performance.now();
          if (drawNodes) renderer.setNodes(nodes);
          const t2 = performance.now();
          if (drawEdges) renderer.setEdges('edges', edges);
          const t3 = performance.now();
          if (drawNodes) timings.setNodes = t2 - t1;
          if (drawEdges) timings.setEdges = t3 - t2;
          if (drawEdges && group.style.dash !== undefined) {
            const dt = previousTs === null ? 0 : (ts - previousTs) / 1000;
            flowPixels = advanceDashFlow(flowPixels, DASH.speedPixelsPerSecond, dt, DASH.periodPixels);
            renderer.setEdgeStyle('edges', { halfWidthPixels: 1, alpha: 1, dashFlowPixels: flowPixels });
            timings.setEdgeStyle = performance.now() - t3;
          }
          previousTs = ts;
          if (rich !== null) {
            // Every node moved, so this is what DagrCanvas's tier feed
            // hands `setNode` on a frame with every spring in flight.
            const t5 = performance.now();
            for (const [i, node] of nodes.entries()) {
              rich.setNode({ id: node.id, bounds: boundsOf(node), data: richData[i] });
            }
            const t6 = performance.now();
            overlay.sync();
            timings.richNodes = t6 - t5;
            timings.sync = performance.now() - t6;
          }
          if (hit) {
            // The drawn array is new every frame, so a click rebuilds the
            // index on this frame, and hover does on one frame in every 100 ms.
            const t7 = performance.now();
            const index = createNodeHitIndex(nodes);
            timings.hitIndex = performance.now() - t7;
            timings.hit = query(index, ts, 'animated');
          }
          const t4 = performance.now();
          renderer.render();
          timings.render = performance.now() - t4;
          return timings;
        });
        const animatedGpu = await gpuFrames();
        const heapAfter = heap();
        const backend = renderer.backend;
        const drawnZoom = renderer.camera.zoom;
        const animatedElements = overlay === null ? null : overlay.activeCount;
        rich?.dispose();
        overlay?.dispose();
        renderer.dispose();
        return {
          count,
          edges: links.length,
          edgeStyle,
          nodeMode,
          parts,
          motion,
          moving,
          springs: source.stats(),
          elements: overlay === null ? null : { still: stillElements, animated: animatedElements },
          hit: hit ? { indexMs: hitIndexMs, hits } : null,
          backend,
          zoom: drawnZoom,
          buildMs,
          heap: { before: heapBefore, built: heapBuilt, afterAnimated: heapAfter },
          still: { ...still, gpu: stillGpu },
          animated: { ...animated, gpu: animatedGpu },
        };
      };

      // Bytes per texel of the formats a texture might be created with.
      // `depth24plus` is the implementation's choice; it is counted as 4.
      const TEXEL_BYTES = {
        r8unorm: 1,
        rg8unorm: 2,
        rgba8unorm: 4,
        'rgba8unorm-srgb': 4,
        bgra8unorm: 4,
        'bgra8unorm-srgb': 4,
        rgba16float: 8,
        rgba32float: 16,
        r32float: 4,
        depth16unorm: 2,
        depth24plus: 4,
        'depth24plus-stencil8': 4,
        depth32float: 4,
        'depth32float-stencil8': 5,
      };
      const unknownFormats = new Set();
      const textureBytes = ({ size, format, mipLevelCount = 1, sampleCount = 1 }) => {
        const [width, height = 1, layers = 1] = Array.isArray(size)
          ? size
          : [size.width, size.height, size.depthOrArrayLayers];
        const texel = TEXEL_BYTES[format];
        if (texel === undefined) {
          unknownFormats.add(format);
          return 0;
        }
        let texels = 0;
        for (let level = 0; level < mipLevelCount; level += 1) {
          texels += Math.max(1, width >> level) * Math.max(1, height >> level);
        }
        return texels * layers * sampleCount * texel;
      };

      // Every buffer and texture created through a GPUDevice, by size, until
      // it is destroyed or its device is. The canvas's own texture comes from
      // its context, not `createTexture`, so it is not in the tally.
      const gpu = { live: new Map(), created: 0, createdBytes: 0, freed: 0, freedBytes: 0 };
      const free = (object) => {
        const entry = gpu.live.get(object);
        if (entry === undefined) return;
        gpu.live.delete(object);
        gpu.freed += 1;
        gpu.freedBytes += entry.bytes;
      };
      window.trackGpu = () => {
        const track = (method, kind, measure) => {
          const original = GPUDevice.prototype[method];
          GPUDevice.prototype[method] = function (descriptor) {
            const made = original.call(this, descriptor);
            const bytes = measure(descriptor);
            const format =
              kind === 'texture' ? `${descriptor.format} x${descriptor.sampleCount ?? 1}` : undefined;
            gpu.live.set(made, { kind, bytes, format, device: this });
            gpu.created += 1;
            gpu.createdBytes += bytes;
            return made;
          };
        };
        track('createBuffer', 'buffer', (descriptor) => descriptor.size);
        track('createTexture', 'texture', textureBytes);
        for (const proto of [GPUBuffer.prototype, GPUTexture.prototype]) {
          const original = proto.destroy;
          proto.destroy = function () {
            free(this);
            return original.call(this);
          };
        }
        const destroyDevice = GPUDevice.prototype.destroy;
        GPUDevice.prototype.destroy = function () {
          for (const [object, entry] of gpu.live) if (entry.device === this) free(object);
          return destroyDevice.call(this);
        };
      };
      const gpuTally = (window.gpuTally = () => {
        const live = { buffer: 0, texture: 0 };
        const textureFormats = {};
        for (const { kind, bytes, format } of gpu.live.values()) {
          live[kind] += bytes;
          if (format !== undefined) textureFormats[format] = (textureFormats[format] ?? 0) + bytes;
        }
        return {
          buffers: live.buffer,
          textures: live.texture,
          textureFormats,
          created: gpu.created,
          createdBytes: gpu.createdBytes,
          freed: gpu.freed,
          freedBytes: gpu.freedBytes,
          unknownFormats: [...unknownFormats],
        };
      });

      // Builds the scene one pass at a time, the way DagrCanvas does (an empty
      // renderer, then its nodes, then its edges), so the runner can read what
      // each step left behind. The move steps animate one pass alone, so what a
      // frame allocates is that pass's.
      let held = null;
      window.memoryStep = async (step, { count, frames, zoom, edgeStyle }) => {
        const render = () => held.renderer.render();
        // `sample` works one frame more than it times, the first having no interval.
        let worked = 0;
        switch (step) {
          case 'graph':
            held = { graph: buildGraph(count), ...EDGE_STYLES[edgeStyle] };
            break;
          case 'renderer': {
            held.renderer = await createRenderer({
              canvas: freshCanvas(),
              backend: 'webgpu',
              edgeGroups: [{ id: 'edges', ...held.group }],
            });
            const { camera } = held.renderer;
            camera.setViewport({ width: 1280, height: 720, devicePixelRatio: window.devicePixelRatio });
            camera.fitBounds(held.graph.bounds);
            if (zoom !== null) camera.setZoom(zoom);
            render();
            break;
          }
          case 'nodes':
            held.renderer.setNodes(nodesAt(held.graph.home));
            render();
            break;
          case 'edges':
            held.renderer.setEdges('edges', edgesAt(held.graph.home, held.graph.links, held.bend));
            render();
            break;
          case 'rich': {
            const { home, links } = held.graph;
            const richData = richDataFor(count, links);
            held.overlay = createHtmlOverlay({ parent: document.getElementById('host'), camera: held.renderer.camera });
            held.rich = createRichNodes({ overlay: held.overlay, tiers: TIERS });
            held.rich.setNodes(
              nodesAt(home).map((node, i) => ({ id: node.id, bounds: boundsOf(node), data: richData[i] })),
            );
            held.overlay.sync();
            render();
            break;
          }
          case 'hit':
            held.index = createNodeHitIndex(nodesAt(held.graph.home));
            break;
          case 'moveNodes':
            await sample(0, frames, (ts) => {
              held.renderer.setNodes(nodesAt(swayed(held.graph.home, ts)));
              render();
              worked += 1;
              return {};
            });
            break;
          case 'moveEdges':
            await sample(0, frames, (ts) => {
              held.renderer.setEdges('edges', edgesAt(swayed(held.graph.home, ts), held.graph.links, held.bend));
              render();
              worked += 1;
              return {};
            });
            break;
          case 'dispose':
            held.rich?.dispose();
            held.overlay?.dispose();
            held.renderer.dispose();
            held = null;
            break;
          default:
            throw new Error(`no memory step ${step}`);
        }
        return { ...gpuTally(), backend: held?.renderer?.backend ?? null, worked };
      };

      window.adapter = async () => {
        if (!('gpu' in navigator)) return { navigatorGpu: false, adapter: null };
        const found = await navigator.gpu.requestAdapter();
        if (found === null) return { navigatorGpu: true, adapter: null };
        const { vendor, architecture, device, description } = found.info;
        return {
          navigatorGpu: true,
          adapter: { vendor, architecture, device, description, isFallbackAdapter: found.info.isFallbackAdapter ?? found.isFallbackAdapter },
        };
      };

      window.ready = true;
    </script>
  </body>
</html>
