name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

      - run: pnpm build

      # Machine-matched performance measurements deliberately stay local.
      # The agent runs pnpm bench:gate before opening a PR. It selects the
      # required measurement or smoke check from the diff, or prints a skip.
      # A measured baseline comparison requires the machine identity recorded
      # in bench/baseline.json; GitHub's runner is not that machine. Control
      # normalization does not make different memory/CPU profiles equivalent.
      # See AGENTS.md and bench/README.md for the local acceptance workflow.
