# Render blueprint: https://render.com/docs/blueprint-spec
#
# Deploys the Docusaurus site in docs/ as a static site at dagr.prnt.design.
# The build runs from the repo root, not docs/, because docs/ is a pnpm
# workspace member — its dependencies only resolve against the root lockfile.

services:
  - type: web
    name: dagr-docs
    runtime: static
    branch: main

    # Wait for the CI workflow to go green before publishing, so a build that
    # typechecks and lints clean is the only thing that reaches the domain.
    autoDeployTrigger: checksPass

    # `--filter docs...` builds the site and everything it depends on, in
    # dependency order. The trailing `...` is what changed when the landing
    # page stopped quoting a committed benchmark figure and started running
    # @dagr/layout in the visitor's browser: the site now imports the engine,
    # so `@dagr/graph` and `@dagr/layout` have to have a `dist` before webpack
    # resolves them. The alternative was compiling the packages' TypeScript
    # source inside the docs bundle, which would have given the site a second
    # build path for code that publishes from `dist`, and a demo built
    # differently from what a consumer installs is a demo of something else.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter docs... build
    staticPublishPath: docs/build

    # Skip deploys for commits that cannot change the site. Paths are globs
    # relative to the repo root. The two packages are listed because the site
    # ships their code now: a layout change with no docs change does change
    # what a visitor runs.
    buildFilter:
      paths:
        - docs/**
        - packages/graph/**
        - packages/layout/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml

    domains:
      - dagr.prnt.design

    previews:
      generation: automatic

    envVars:
      # Match CI (.github/workflows/ci.yml) so a green build there means a
      # green build here.
      - key: NODE_VERSION
        value: '22'

    headers:
      # Docusaurus fingerprints every file under /assets/, so those are safe to
      # cache forever. They all live one level deeper (/assets/css/, /assets/js/),
      # hence `**` — a single `*` does not match across a slash. HTML is left on
      # Render's default revalidation so a deploy never serves a stale page.
      - path: /assets/**/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
