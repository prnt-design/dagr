# Render blueprint: https://render.com/docs/blueprint-spec
#
# ONE static site. `dagr-docs` is the Docusaurus site at dagr.prnt.design: the
# landing page, the reference, and the campaign demo at /demos/campaign.
#
# There was a second, `dagr-demo`, serving `apps/demo` on an `onrender.com`
# subdomain. It was the cheapest thing that produced a URL and it did that; it
# was also a demo a visitor to the docs never found, an outbound hop that lost
# the site's chrome, and twice the deploy surface for one artifact. Every link
# to that URL is retargeted at /demos/campaign in the same commit.
#
# REMOVING THE BLOCK IS HALF OF RETIRING THE SERVICE, and the other half is a
# hand in the Render dashboard. A blueprint sync NEVER deletes an existing
# resource, including one whose definition has gone from this file, and a
# resource removed here but left in the dashboard is RECREATED by the next
# sync. So the order is: this file first, then delete `dagr-demo` in the
# dashboard. Until that second step happens the service keeps the config it was
# last synced with, which means it keeps building `apps/demo` on any push
# matching the `buildFilter` it still holds, and keeps serving a demo that
# nothing links to and that drifts from the one on the docs site.
#
# `apps/demo` itself stays as the playground the engine is exercised in, and is
# now a local dev tool with no deploy: it imports the same stage the site
# mounts, so what it shows and what the site shows cannot drift.
#
# The build runs from the repo ROOT, not from the site's own directory, because
# the site is a pnpm workspace member and its dependencies only resolve against
# the root lockfile.

services:
  - type: web
    name: dagr-docs
    runtime: static
    branch: main

    # Wait for the CI workflow to go green before publishing, so a build that
    # typechecks and lints clean is the only thing that reaches the domain.
    autoDeployTrigger: checksPass

    # `--filter docs...` builds the site and everything it depends on, in
    # dependency order. The trailing `...` is what changed when the landing
    # page stopped quoting a committed benchmark figure and started running
    # @dagr/layout in the visitor's browser: the site now imports the engine,
    # so `@dagr/graph` and `@dagr/layout` have to have a `dist` before webpack
    # resolves them. The alternative was compiling the packages' TypeScript
    # source inside the docs bundle, which would have given the site a second
    # build path for code that publishes from `dist`, and a demo built
    # differently from what a consumer installs is a demo of something else.
    # The campaign demo added three more packages behind the same `...`, and
    # `@dagr/campaign-stage` is the reason it matters twice over: webpack reads
    # its `dist`, so a stage change that is not built is a site that ships the
    # last one.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter docs... build
    staticPublishPath: docs/build

    # Skip deploys for commits that cannot change the site. Paths are globs
    # relative to the repo root. The packages are listed because the site ships
    # their code now: a layout or a renderer change with no docs change does
    # change what a visitor runs.
    buildFilter:
      paths:
        - docs/**
        - packages/campaign/**
        - packages/campaign-stage/**
        - packages/graph/**
        - packages/layout/**
        - packages/render/**
        # Every package's build config extends it, so it decides what `dist` the
        # site ships.
        - tsconfig.base.json
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml

    domains:
      - dagr.prnt.design

    previews:
      generation: automatic

    envVars:
      # Match CI (.github/workflows/ci.yml) so a green build there means a
      # green build here.
      - key: NODE_VERSION
        value: '22'

    headers:
      # Docusaurus fingerprints every file under /assets/, so those are safe to
      # cache forever. They all live one level deeper (/assets/css/, /assets/js/),
      # hence `**` — a single `*` does not match across a slash. HTML is left on
      # Render's default revalidation so a deploy never serves a stale page.
      - path: /assets/**/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
